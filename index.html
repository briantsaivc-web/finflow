  var floor = w.cashReserveFloor * p.derived.totalExpenses * 0.5;
  var spare = util.r2(p.cash - floor);
  if(spare < 1) return null;
  // 先還無擔保／只付息的高利率貸款
  var cand = p.liabilities.filter(function(l){ return l.principal>1 && !l.studentLoan; })
    .sort(function(a,b){
      var ka=(a.kind==="MARGIN"||a.kind==="CONSUMER"||a.kind==="CREDIT")?0:1;
      var kb=(b.kind==="MARGIN"||b.kind==="CONSUMER"||b.kind==="CREDIT")?0:1;
      if(ka!==kb) return ka-kb;
      if(b.annualRate!==a.annualRate) return b.annualRate-a.annualRate;
      return a.instanceId<b.instanceId?-1:1;   // 決定論穩定排序
    })[0];
  if(!cand) return null;
  var amt = util.r2(Math.min(spare, cand.principal));
  if(amt < 1) return null;
  return { type:"REPAY_LOAN", playerId:p.id, payload:{ liabilityId:cand.instanceId, amount:amt } };
};

npc.decide = function(S,p,d){
  var w=ns.content.personalityById[p.npcPersonality].weights;
  var A=function(opt,params){ return { type:"DECIDE", playerId:p.id,
    payload:{ decisionId:d.decisionId, optionId:opt, params:params||{} } }; };
  switch(d.kind){
    case "ACK": case "TRIAL_RESULT": case "BLESSING": return A("ok");   // 盲盒自動開盒
    case "LIFESTYLE": {
      var lc=ns.content.byId[d.cardId], lcost=(lc&&lc.payload&&lc.payload.cost)||0;
      // v0.2：買不起不硬買（現金付完至少留半個月支出）；誘惑失足由人格機率決定
      var canPay = p.cash-lcost >= 0.5*p.derived.totalExpenses;
      return A((canPay && util.randAux(S)<w.optionalLifestyleBuyProb) ? "buy" : "skip"); }
    case "CULTIVATE": {
      var c=ns.content.byId[d.cardId], cost=(c.payload&&c.payload.cost)||0;
      var afford = p.cash-cost > w.cashReserveFloor*p.derived.totalExpenses*0.5;
      return A((afford && util.randAux(S)<w.cultivateVirtueProb) ? "invest" : "skip"); }
    case "PROFESSION_EVENT": {
      var pc=ns.content.byId[d.cardId];
      var wantExam = pc.id==="PE_CPA_EXAM" && p.cash>200;
      return A(wantExam?0:1); }
    case "SELF_INVEST": {
      var sc=ns.content.byId[d.cardId], op0=sc.decision.options[0], cost=op0.cost||0;
      var boostsSalary = op0.effects.some(function(e){return e.op==="SALARY_MULT";});
      var afford = p.cash-cost > w.cashReserveFloor*p.derived.totalExpenses;
      // 薪資提升長期划算，多數性格願投資；降支出型也划算
      return A(afford ? 0 : 1); }
    case "CHOICE": {
      var ch=ns.content.byId[d.cardId], o0=ch.decision.options[0], c0=o0.cost||0;
      var cheapest=0, cheapCost=1e9;
      ch.decision.options.forEach(function(op,i){ var c=op.cost||0; if(c<cheapCost){cheapCost=c;cheapest=i;} });
      var okFirst = p.cash-c0 > w.cashReserveFloor*p.derived.totalExpenses;
      return A(okFirst ? 0 : cheapest); }
    case "FOLLOW_ON":
      return A((w.startupAppetite>0.5 && p.cash>d.invest*1.5) ? "follow" : "pass");
    case "GRADUATE": return A("go");
    case "BUY_PROGRESS": {
      // v0.2：現金底線之上才買（npcCashFloorOuter × 月支出）
      var floorO=(E.cfg(S,"npcCashFloorOuter")!==undefined?E.cfg(S,"npcCashFloorOuter"):3)*p.derived.totalExpenses;
      return A((p.cash-(d.price||0) >= floorO) ? "buy" : "skip"); }
    case "BANKRUPTCY": return A("declare");
    case "FREEFALL_RESCUE": return A("fall");   // 防禦：NPC 危機已在引擎側自動處理，不應到這
    case "BUY": return npc.scoreBuy(S,p,d,w,A);
    // §2.3 二選一：對兩張各算 報酬率／門檻 分數，取高分（決定論，不用 RNG）
    case "PICK_OPP": {
      var ids=d.cardIds||[];
      if(!ids.length) return A("none");
      var bestId=ids[0], bestSc=-1e9;
      ids.forEach(function(id){
        var c=ns.content.byId[id]; if(!c) return;
        // 用 oppCompare（涵蓋股票／新創）而非 oppIncome/oppEntry——後者對 STOCK/STARTUP 一律回 0，
        // 會讓 NPC 對股票卡完全盲目。公式仍是工程書指定的 income/entry。
        var cmp=E.oppCompare(S,c), inc=cmp.income, ent=cmp.entry;
        var sc=inc/Math.max(1,ent);
        if(p.cash<ent) sc*=0.2;                                   // 付不起入手門檻
        sc *= (w.cashflowPerCost||1);                             // LEVER 偏好高報酬率
        // SAFE（高 cashReserveFloor）偏好低門檻
        sc -= (w.cashReserveFloor||0) * (ent/Math.max(1,p.derived.totalExpenses)) * 0.0005;
        if(sc>bestSc){ bestSc=sc; bestId=id; }
      });
      return A(bestId); }
  }
  return A("skip");
};

npc.scoreBuy = function(S,p,d,w,A){
  var c=ns.content.byId[d.cardId], D=p.derived, floor=w.cashReserveFloor*D.totalExpenses;
  var best={score:-1e9, opt:"skip", params:{}};
  function consider(opt, cost, cfDelta, ltv, gain, params){
    if(cost>p.cash) return;
    var s=0;
    s += w.cashflowPerCost * (cfDelta*12) / Math.max(1,cost) * 100;
    s += w.capitalGainAppetite * gain;
    var after=p.cash-cost;
    if(after<floor) s -= Math.min(45, (floor-after)/Math.max(1,floor)*28);
    if(after<0.5*D.totalExpenses) s -= 60;
    if(ltv>w.maxLtvTolerance) s -= 100;
    if(cfDelta<=0 && gain<=0) s -= 30;
    if(s>best.score) best={score:s, opt:opt, params:params||{}};
  }
  if(c.kind==="REALESTATE"){
    var pl=c.payload, net=util.r2(pl.monthlyRent*S.config.assetIncomeMult-pl.monthlyCost);
    if(d.allowLoan){
      var ltv=Math.min(1-pl.downPayment/pl.price, d.maxLTV, w.maxLtvTolerance);
      var loan=pl.price*ltv, down=util.r2(pl.price-loan);
      var rate=S.macro.baseRate+E.cfg(S,"mortgageSpread");
      consider("loan", down, util.r2(net-loan*rate/12), ltv, 0.5, {ltv:ltv});
    }
    consider("cash", pl.price, net, 0, 0.3);
  } else if(c.kind==="STOCK"){
    var def=ns.content.stockBySymbol[c.payload.symbol], price=S.stockPrices[def.symbol]||c.payload.offerPrice;
    var units=Math.max(1, Math.floor(Math.min(p.cash*0.35, 900)/price));
    if(units>=1) consider("cash", util.r2(price*units), util.r2(price*units*def.dividendYieldMonthly),
      0, def.vol*30*w.capitalGainAppetite, {units:units});
  } else if(c.kind==="BUSINESS"){
    consider("cash", c.payload.price, util.r2(c.payload.monthlyProfit*S.config.assetIncomeMult), 0, 0.2);
  } else if(c.kind==="STARTUP"){
    if(w.startupAppetite>0.2) consider("cash", c.payload.investAmount, 0, 0, w.startupAppetite*40);
  }
  return best.score>0 ? A(best.opt,best.params) : A("skip");
};

/* NPC 自動脫困 */
E.npcRescue = function(S,p){
  var guard=0;
  while(p.cash<0 && guard++<30){
    var sellable=p.assets.filter(function(a){ return a.kind!=="P2P_LOAN"; });   // §4：債權不可急售變現
    if(!sellable.length) break;
    var need=-p.cash, fmult=S.config.fireSaleRatio;
    // V11：先找「單賣一筆就夠、且犧牲現金流最少」的資產；沒有才賣最大的一筆逼近缺口
    var enough=sellable.filter(function(a){ return util.r2(a.marketValue*fmult) >= need; })
      .sort(function(a,b){ return a.monthlyIncome-b.monthlyIncome || a.marketValue-b.marketValue; })[0];
    var pick = enough || sellable.slice().sort(function(a,b){ return b.marketValue-a.marketValue; })[0];
    E.sellAsset(S,p,pick,fmult);
  }
  if(p.cash<0){
    var cap=E.rescueCap(S,p);
    if(cap>1){ if(p.creditFlags) p.creditFlags.usedRescue=true;   // M7：NPC 動用紓困同樣留下信用瑕疵
      E.addLiability(S,p,"CONSUMER","紓困貸款",cap,S.macro.baseRate+E.cfg(S,"rescueLoanSpread"),false);
      ledger.post(S,p,"紓困貸款撥款",[{account:"CASH",delta:cap,label:"貸款撥款"}],{eduTags:["debt"]}); }
  }
  if(p.cash<0) E.declareBankrupt(S,p); else p.skippedTurns+=1;
};

/* ============================== 模擬器 ================================== */
ns.sim = {
  playOne: function(cfg, modules, seed, lineup){
    var players = lineup.map(function(per,i){
      return { name:"P"+i, isNPC:true, personality:per,
        professionId: ns.sim.pickProfession(i, modules, seed),
        dreamCardId: ns.content.dreams[i % ns.content.dreams.length].id };
    });
    var S = E.newGame({ seed:seed, config:util.clone(cfg), modules:modules, players:players });
    E.beginTurn(S);
    var guard=0;
    while(!S.over && guard++ < 6000){
      var a = npc.nextAction(S);
      if(!a){
        var res=E.apply(S,{type:"END_TURN",playerId:E.activePlayer(S).id},{mutate:true});
        if(res.rejected) break; else S=res.state; continue; }
      if(a.type==="DECIDE" && S.pendingDecision) a.payload.decisionId=S.pendingDecision.decisionId;
      var r=E.apply(S,a,{mutate:true});
      if(r.rejected){ var r2=E.apply(S,{type:"END_TURN",playerId:E.activePlayer(S).id},{mutate:true});
        if(r2.rejected) break; S=r2.state; } else S=r.state;
    }
    return S;
  },
  pickProfession: function(i, modules, seed){
    var list = ns.content.professions.filter(function(p){ return !p.moduleReq || modules.indexOf(p.moduleReq)>=0; });
    // 跨薪資帶均勻取樣，避免整桌都落在同一收入層而扭曲平衡數據
    var stride = list.length/4;
    return list[Math.floor(i*stride + ((seed||0)+i*7)%Math.max(1,Math.floor(stride)))%list.length].id;
  },
  run: function(o){
    var games=o.games||200, seedBase=o.seedBase||1, lineup=o.lineup||["NPC_SAFE","NPC_LEVER","NPC_VC","NPC_SAFE"];
    var rows=[], byPer={};
    // v0.2 平衡指標：外圈耗時／跌落率／免費點占比／四類公平性
    var ox={ dur:[], byCat:{}, grads:0, freefalls:0, freeP:0, paidP:0,
      done:function(){
        var med=function(a){ if(!a.length) return null; var b=a.slice().sort(function(x,y){return x-y;}); return b[Math.floor(b.length/2)]; };
        var catMed={}; Object.keys(ox.byCat).forEach(function(k){ catMed[k]=med(ox.byCat[k]); });
        return { outerMedian:med(ox.dur), outerP90:(function(){ if(!ox.dur.length) return null;
            var b=ox.dur.slice().sort(function(x,y){return x-y;}); return b[Math.min(b.length-1,Math.floor(b.length*0.9))]; })(),
          wins:ox.dur.length, grads:ox.grads,
          freefallRate: ox.grads? ox.freefalls/ox.grads : 0,
          freeShare: (ox.freeP+ox.paidP)? ox.freeP/(ox.freeP+ox.paidP) : 0,
          catMedian:catMed };
      } };
    lineup.forEach(function(p){ byPer[p]={free:[],bankrupt:0,n:0,nw:[]}; });
    for(var g=0; g<games; g++){
      var S=ns.sim.playOne(o.config, o.modules, (seedBase+g*7919)>>>0, lineup);
      S.players.forEach(function(p){
        var b=byPer[p.npcPersonality]; b.n++;
        if(p.bankrupt) b.bankrupt++;
        if(p.freeAtTurn) b.free.push(p.freeAtTurn);
        b.nw.push(p.derived.netWorth);
        if(p.graduatedAtTurn!==null && p.graduatedAtTurn!==undefined){
          ox.grads++;
          ox.freefalls += (p.stats.freefalls||0);
          ox.freeP += (p.stats.freeProgress||0); ox.paidP += (p.stats.paidProgress||0);
          if(S.winner===p.id && p.dreamProgress>=S.config.dreamCost){
            var du=S.turnNumber-p.graduatedAtTurn;
            ox.dur.push(du);
            var cat=(ns.content.byId[p.dreamCardId]||{}).category||"?";
            (ox.byCat[cat]=ox.byCat[cat]||[]).push(du);
          }
        }
      });
      rows.push({ seed:S.seed, turns:S.turnNumber, winner:S.winner,
        free:S.players.map(function(p){return p.freeAtTurn||"";}).join("|"),
        nw:S.players.map(function(p){return Math.round(p.derived.netWorth);}).join("|") });
    }
    var med=function(a){ if(!a.length) return null; var b=a.slice().sort(function(x,y){return x-y;});
      return b[Math.floor(b.length/2)]; };
    var pct=function(a,q){ if(!a.length) return null; var b=a.slice().sort(function(x,y){return x-y;});
      return b[Math.min(b.length-1,Math.floor(b.length*q))]; };
    var summary=Object.keys(byPer).map(function(k){ var b=byPer[k];
      return { personality:k, games:b.n, freeRate:b.free.length/Math.max(1,b.n),
        medianFreeTurn:med(b.free), p10:pct(b.free,0.1), p90:pct(b.free,0.9),
        bankruptRate:b.bankrupt/Math.max(1,b.n), medianNetWorth:med(b.nw) }; });
    return { summary:summary, rows:rows, games:games, outerStats:ox.done() };
  }
};

})(ns);
</script>

      b.appendChild(d);

ui.start = function(cfg, preset){
  var config = ns.buildConfig(ns.configRegistry);
  Object.keys(ui.configOverrides||{}).forEach(function(k){ config[k]=ui.configOverrides[k]; });
  config.depthLevel=preset.d; config.volatilityLevel=preset.v; config.automationLevel=preset.a;
  config.oppDualChoice = preset.d>=2 ? 1 : 0;   // §2.3：僅標準難度以上開啟機會二選一
  config.stockVolatilityMult = preset.v===1?0:(preset.v===3?2:1);
  config.macroTransitionProb = preset.v===1?0:(preset.v===3?1.8:1);
  config.eventCardRate = preset.v===1?0.5:(preset.v===3?1.5:1);
  var players=[{ name:"你", isNPC:false, professionId:cfg.professionId, dreamCardId:cfg.dreamCardId }];
  var pers=ns.content.personalities, dreams=ns.content.dreams;
  var pool=ns.content.professions.filter(function(p){ return (!p.moduleReq||cfg.modules.indexOf(p.moduleReq)>=0) && p.id!==cfg.professionId; });
  for(var i=0;i<cfg.npcs;i++){
    var per=pers[i%pers.length];
    players.push({ name:per.name, isNPC:true, personality:per.id,
      professionId: pool[(i*5+3)%pool.length].id, dreamCardId: dreams[(i+1)%dreams.length].id });
  }
  // 八期：開新局務必清空上一局的殘留（否則系統訊息會混入上一局的輪次）
  ui.feed=[]; ui.lastAct={}; ui.viewPlayerId=null; ui._lastRoll={};
  if(ui._autoRollT){ clearInterval(ui._autoRollT); ui._autoRollT=null; }
  ui.S = E.newGame({ seed:cfg.seed, config:config, modules:cfg.modules, players:players });
  E.beginTurn(ui.S);
  $("app").classList.remove("hide");
  ui.render(); ui.tick();
  ui.showRules(true);
};

ui.render = function(){
  var S=ui.S; if(!S) return;
  ui.renderTop(); ui.renderBoard(); ui.renderFinBoard(); ui.renderSheet();
  ui.renderCenter(); ui.renderPlayerCards();
};

var STAGE_NAME={RECOVERY:"復甦",BOOM:"過熱",RECESSION:"衰退",DEPRESSION:"蕭條"};
ui.renderTop = function(){
  // 七期：頂列僅剩圖示鈕（輪次與事件改由中欄「系統訊息」承載）；保留 hook 供舊元素相容
  var S=ui.S;
  var tb=$("turnBadge"); if(tb) tb.textContent="第 "+S.turnNumber+" / "+S.config.maxTurns+" 輪";
};

var CELL_COLOR={PAYDAY:"var(--pay)",OPPORTUNITY:"var(--opp)",LIFESTYLE:"var(--life)",
  MARKET:"var(--mkt)",LIFE_EVENT:"var(--evt)",LAYOFF:"var(--lay)",
  OPAYDAY:"var(--pay)",SITE:"var(--mkt)",OEVENT:"var(--evt)"};
var CELL_LABEL={PAYDAY:"發薪",OPPORTUNITY:"機會",LIFESTYLE:"生活",MARKET:"市場",
  LIFE_EVENT:"人生",LAYOFF:"失業",OPAYDAY:"現金流",OEVENT:"風雲",
  TASTE:"饗食",SUMMIT:"山海",VOYAGE:"旅行",LEGACY:"傳承"};

ui.ringPos = function(i,n,rx,ry){ var a=-Math.PI/2 + i*2*Math.PI/n;
  return { x:380+rx*Math.cos(a), y:350+ry*Math.sin(a) }; };
// 矩形環佈局：沿矩形四邊平均分佈（左上角起、順時針）—— 比橢圓省空間、不切邊
ui.rectPos = function(i,n,hw,hh,cx,cy){
  var W=2*hw, H=2*hh, P=2*(W+H), d=(i/n)*P, x, y;
  if(d < W){ x=cx-hw+d; y=cy-hh; }
  else if(d < W+H){ x=cx+hw; y=cy-hh+(d-W); }
  else if(d < 2*W+H){ x=cx+hw-(d-W-H); y=cy+hh; }
  else { x=cx-hw; y=cy+hh-(d-2*W-H); }
  return { x:x, y:y };
};

ui.renderBoard = function(){
  var S=ui.S, svg=$("boardSvg"), C=ns.content;
  // 九期：兩環曾因等寬貼齊而視覺相連，看起來像沒換圈——改為夢想圈內縮＋獨立底板＋分隔線
  var ICX=260, ICY=234, IHW=228, IHH=188;   // 老鼠圈
  var OCX=260, OCY=580, OHW=204, OHH=84;    // 夢想圈（左右內縮 24，與老鼠圈明顯錯開）
  var out="";
  // 夢想圈底板（先畫，當背景）＋兩區分隔線
  out+='<defs><linearGradient id="dreamBg" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#2A1F45" stop-opacity="0.55"/>'+
       '<stop offset="1" stop-color="#123047" stop-opacity="0.55"/></linearGradient></defs>';
  out+='<line x1="46" y1="454" x2="474" y2="454" stroke="#2E4462" stroke-width="1" stroke-dasharray="6 6"/>';
  out+='<rect x="26" y="470" width="468" height="220" rx="26" fill="url(#dreamBg)" '+
       'stroke="#5A4A86" stroke-opacity="0.7" stroke-width="1.5"/>';
  C.boardLayout.forEach(function(sp,i){
    var p=ui.rectPos(i,C.boardLayout.length,IHW,IHH,ICX,ICY), c=CELL_COLOR[sp.type];
    var here=S.players.some(function(pl){ return !pl.bankrupt && pl.playerStage==="INNER" && pl.position===i; });
    out+='<g class="sp-cell'+(here?" here":"")+'"><rect x="'+(p.x-22)+'" y="'+(p.y-22)+'" width="44" height="44" rx="10" '+
      'fill="'+c+'" fill-opacity="'+(sp.type==="PAYDAY"?0.32:0.17)+'" stroke="'+c+'" stroke-opacity="0.65"/>'+
      '<text class="sp-label" x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" fill="'+c+'">'+CELL_LABEL[sp.type]+'</text></g>';
  });
  if(C.boardLayoutOuter){
    var anyOuter=S.players.some(function(pl){return pl.playerStage==="OUTER";});
    // 七期：夢想圈是快樂的——鮮明繽紛配色、實線、亮底
    var OUTER_COLOR={TASTE:"#FF7A9E",SUMMIT:"#4CC9F0",VOYAGE:"#B07CF7",LEGACY:"#F9C74F",
                     OPAYDAY:"#3DDC97",OEVENT:"#FF9E4F"};
    C.boardLayoutOuter.forEach(function(sp,i){
      var p=ui.rectPos(i,C.boardLayoutOuter.length,OHW,OHH,OCX,OCY);
      var hereO=S.players.some(function(pl){ return !pl.bankrupt && pl.playerStage==="OUTER" && pl.outerPos===i; });
      var lab = sp.type==="SITE"?CELL_LABEL[sp.category]:CELL_LABEL[sp.type];
      var c = sp.type==="SITE" ? (OUTER_COLOR[sp.category]||"#F9C74F") : (OUTER_COLOR[sp.type]||"#F9C74F");
      out+='<g class="sp-cell'+(hereO?" here":"")+'" opacity="'+(anyOuter?1:0.6)+'">'+
        '<rect x="'+(p.x-22)+'" y="'+(p.y-20)+'" width="44" height="40" rx="11" '+
        'fill="'+c+'" fill-opacity="'+(hereO?0.45:0.28)+'" stroke="'+c+'" stroke-opacity="0.95" stroke-width="'+(hereO?2.4:1.6)+'"/>'+
        '<text class="sp-label" x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" fill="'+c+'">'+lab+'</text></g>';
    });
    out+='<text x="'+OCX+'" y="'+(OCY-6)+'" text-anchor="middle" fill="#C9B6FF" font-size="15" letter-spacing="6" font-weight="700">夢 想 圈</text>';
    out+='<text x="'+OCX+'" y="'+(OCY+14)+'" text-anchor="middle" fill="#7E8FB5" font-size="12" letter-spacing="1">'+
         (anyOuter?"自己夢想類別的聖地免費 +1 點":"達成財務自由後才會走到這裡")+'</text>';
  }
  // 九期：同格才需要錯開——原本用「全體玩家索引」算橫向位移，
  //       導致獨自站一格的棋子也被推開十幾 px，看起來沒站在格子上
  var slot={}, slotN={};
  S.players.forEach(function(pl){
    if(pl.bankrupt) return;
    var k=(pl.playerStage==="OUTER"?"O":"I")+(pl.playerStage==="OUTER"?pl.outerPos:pl.position);
    slot[pl.id]=(slotN[k]||0); slotN[k]=(slotN[k]||0)+1;
  });
  S.players.forEach(function(pl,idx){
    if(pl.bankrupt) return;
    var outer=pl.playerStage==="OUTER";
    var n=outer?C.boardLayoutOuter.length:C.boardLayout.length;
    var cx=outer?OCX:ICX, cy=outer?OCY:ICY;
    var cellIdx=outer?pl.outerPos:pl.position;
    var bp=ui.rectPos(cellIdx, n, outer?OHW:IHW, outer?OHH:IHH, cx, cy);
    var dx=cx-bp.x, dy=cy-bp.y, len=Math.hypot(dx,dy)||1;
    var pull=outer?6:15, spread=outer?10:12;
    var key=(outer?"O":"I")+cellIdx, cnt=slotN[key]||1;
    var off=(slot[pl.id]-(cnt-1)/2)*spread;      // 只跟「同一格的人」錯開
    var px=bp.x+dx/len*pull+off, py=bp.y+dy/len*pull;
    var col=ui.playerColor(pl);
    out+='<circle class="pawn" cx="'+px+'" cy="'+py+'" r="11" fill="#131D2B" stroke="'+col+'" stroke-width="2.5"/>'+
         '<text class="pawn" x="'+px+'" y="'+(py+4.5)+'" text-anchor="middle" font-size="13">'+ui.avatar(pl)+'</text>';
    if(idx===S.activePlayerIdx)
      out+='<circle class="pawn-ring" cx="'+px+'" cy="'+py+'" r="15" stroke="'+col+'" opacity="0.8"/>';
  });
  out+='<text x="'+ICX+'" y="'+(ICY+92)+'" text-anchor="middle" fill="#54697F" font-size="13" letter-spacing="5" font-weight="700">老 鼠 圈</text>';
  svg.innerHTML=out;
};

/* 六期：職業頭像（emoji）——盤面棋子與玩家動作列共用 */
var PROF_EMOJI={PRO_CLERK:"🏪",PRO_FARMER:"🧑‍🌾",PRO_TECHOP:"🔧",PRO_DELIVERY:"🛵",PRO_MKT:"📣",
  PRO_AUDITOR:"🧮",PRO_NURSE:"💉",PRO_CIVIL:"🏛️",PRO_BANKER:"🏦",PRO_PLUMBER:"🪛",
  PRO_DATA:"📊",PRO_ECOM:"📦",PRO_ENGINEER:"💻",PRO_FOOD:"🍜",PRO_SALES:"🤝",
  PRO_PM:"📋",PRO_SEMI:"🔬",PRO_CONSULT:"💼",PRO_FOUNDER:"🚀",PRO_DOCTOR:"🩺"};

ui.cellLabel = function(outer, idx){

ui.playerColor = function(p){ return p.isNPC?ns.content.personalityById[p.npcPersonality].color:"#F2C14E"; };

/* M7 信用評級顯示 helper（p8 亦透過 ui.* 使用） */
ui.creditSpreadPct = function(S,p){ return util.pct(E.creditSpread(S,p),1); };
ui.creditDesc = function(S,p){
  var r=p.creditRating||"B", sp=E.creditSpread(S,p), dbr=E.cfg(S,"dbr_"+r);

    nm.appendChild(ui.creditBadge(S,p,false));
    if(ui.viewPlayerId===p.id) nm.appendChild(el("span",null,"👁"));
    c.appendChild(nm);
    var stTxt = p.bankrupt ? "破產出局"
      : (p.skippedTurns>0 ? "停走 "+p.skippedTurns+" 輪"
      : (i===S.activePlayerIdx ? (p.isNPC?"思考中…":"你的回合") : "等待"));

      ui.viewPlayerId=(ui.viewPlayerId===pid?null:pid); ui.renderSheet(); ui.renderPlayerCards(); }; })(p.id);

    "現在不是你的操作時機（交易與借貸只能在自己回合進行）");
  var mallPer=E.cfg(S,"mallPerTurn"); if(mallPer===undefined) mallPer=1;
  var mallLeft=mallPer-(me0.mallBoughtThisTurn||0);

    mallPer<=0 ? "本局未開啟人生商城" : (mallLeft<=0 ? "本回合的商城額度已用完" : "現在不是你的操作時機"));

  // 目前生效中的狀態

  if(p.flags && p.flags.insured) st.push("🛡 醫療＋意外險投保中（保費 "+M(p.flags.insurancePremium||0)+"／月）");
  if(p.flags && p.flags.fitUntil!==undefined && S.turnNumber<=p.flags.fitUntil) st.push("🏋 健身中（至第 "+p.flags.fitUntil+" 輪）");
  if(p.flags && p.flags.checkedUntil!==undefined && S.turnNumber<=p.flags.checkedUntil) st.push("🩺 健檢有效（至第 "+p.flags.checkedUntil+" 輪）");
  if(st.length){
    var stRow=el("div","flavor"); stRow.style.cssText="margin-bottom:6px;color:var(--pos)";
    stRow.textContent="生效中："+st.join("　");
    box.appendChild(stRow);
    if(p.flags.insured && canAct){
      var cb=el("button","mini","解約保險");
      cb.onclick=function(){ ov.remove(); ui.dispatch({type:"MALL_CANCEL_INSURANCE",playerId:0,payload:null}); };
      box.appendChild(cb);
    }
  }

  var items=ui.mallItems(), groups=[];
  items.forEach(function(it){ if(groups.indexOf(it.group)<0) groups.push(it.group); });
  groups.forEach(function(g){
    box.appendChild(el("div","mallGroup",g));
    var grid=el("div","mallGrid");
    items.filter(function(it){ return it.group===g; }).forEach(function(it){
      var pl=it.payload||{};
      var b=el("button","mallItem");
      var owned = pl.insurance && p.flags && p.flags.insured;
      if(owned) b.className+=" mallOn";
      b.appendChild(el("div","ic",pl.icon||it.icon||"🛍"));
      b.appendChild(el("div","tt",it.title));
      b.appendChild(el("div","fl",it.flavor||""));
      var price=[];
      if(pl.cost) price.push("一次 "+M(pl.cost));
      if(pl.recurringMonthly) price.push("每月 "+M(pl.recurringMonthly));
      if(!price.length) price.push("免費");
      var extra=[];
      if(pl.joy) extra.push("幸福感 +"+pl.joy);
      if(pl.virtue) extra.push("品格 "+T("virtue."+pl.virtue)+" +1");
      if(pl.skipTurns) extra.push("停走 "+pl.skipTurns+" 輪");
      if(pl.chance!==undefined) extra.push("成功機率 "+Math.round(pl.chance*100)+"%");
      if(pl.contest) extra.push("擲骰決定獎金");
      if(pl.note) extra.push(pl.note);
      b.appendChild(el("div","pr",price.join("　")));
      if(extra.length){ var ex=el("div","fl",extra.join("　·　")); ex.style.marginTop="3px"; b.appendChild(ex); }
      var why="";
      if(!canAct) why="現在不是你的操作時機";
      else if(left<=0) why="本回合的商城額度已用完";
      else if(owned) why="已投保，不需重複購買";
      else if(pl.reqChild && !(p.childrenCount>0)) why="還沒有小孩";
      else if((pl.cost||0)>p.cash) why="現金不足";
      b.disabled=!!why; b.title=why||(it.eduNote||"");
      b.onclick=function(){
        var after=util.r2(p.cash-(pl.cost||0));
        ui.spendGuard(after, function(){
          ov.remove(); ui.dispatch({type:"MALL_BUY",playerId:0,payload:{itemId:it.id}});
        });
      };
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
  var o=el("div","opts"); o.appendChild(optBtn(T("act.close"),null,function(){ ov.remove(); }));
  box.appendChild(o); ov.appendChild(box); $("overlays").appendChild(ov);
};

// 24px 迷你走勢
ui.miniSpark = function(hist, up){
  if(!hist || hist.length<2) return "";
  var W=52,H=24,mn=Math.min.apply(null,hist),mx=Math.max.apply(null,hist),rng=(mx-mn)||1;
  var pts=hist.map(function(v,i){ var x=i*(W/(hist.length-1)), y=H-2-((v-mn)/rng)*(H-4);
    return x.toFixed(1)+","+y.toFixed(1); }).join(" ");
  return "<svg width='"+W+"' height='"+H+"' style='display:block'><polyline points='"+pts+
    "' fill='none' stroke='"+(up?"#35C4A8":"#F0803C")+"' stroke-width='1.5'/></svg>";
};

      return vshort[ax]+" "+(p.virtues[ax]||0); }).join("・");
    var vsp=el("span","wbClick","　品格 "+vtxt); vsp.style.color="var(--gold)";
    vsp.title="品格四軸（滿級 "+S.config.virtueMaxLevel+"）：點擊看完整積累明細";
    vsp.onclick=function(){ ui.showWellbeingDetail(p); };
    wb.appendChild(vsp);
  }
  // V10：保險與健康狀態
  var badges=[];
  if(p.flags && p.flags.insured) badges.push("🛡 醫療意外險");
  if(p.flags && p.flags.fitUntil!==undefined && S.turnNumber<=p.flags.fitUntil) badges.push("🏋 健身中");
  if(p.flags && p.flags.checkedUntil!==undefined && S.turnNumber<=p.flags.checkedUntil) badges.push("🩺 健檢有效");
  if(badges.length){ var bsp=el("span",null,"　"+badges.join("・")); bsp.style.color="var(--pos)"; wb.appendChild(bsp); }
  head.appendChild(wb);
  var btnRow=el("div"); btnRow.style.cssText="display:flex;gap:8px;margin-top:7px";
  var bDet=el("button","act","收支明細"); bDet.style.flex="1"; bDet.style.padding="8px";
  bDet.onclick=function(){ ui.showDetails(p); };
  btnRow.appendChild(bDet);
  head.appendChild(btnRow);
  box.appendChild(head);

  /* 損益表｜資產負債表（並排） */
  var fin=el("div","sec");
  var g=el("div","twoCol");
  function miniTable(title, rows){
    var dv=el("div");
    dv.appendChild(el("h4",null,title)).style.cssText="margin:0 0 4px;font-size:var(--fs-xs);letter-spacing:.12em;color:var(--tx3)";

      var row=el("div","row"+(r.total?" total":"")); row.style.fontSize="11px";

      row.appendChild(el("span","val num"+(r.cls?" "+r.cls:""),M(r.v)));
      dv.appendChild(row);
    });
    return dv;
  }
  g.appendChild(miniTable(T("sheet.is"),[
    {l:"主動收入", v:d.salaryIncome},
    {l:"被動收入", v:d.passiveIncome, cls:d.passiveIncome>0?"pos":""},
    {l:"總支出", v:-d.totalExpenses, cls:"neg"},
    {l:"淨現金流", v:d.netCashflow, cls:d.netCashflow>=0?"pos":"neg", total:true}
  ]));
  g.appendChild(miniTable(T("sheet.bs"),[
    {l:"現金", v:p.cash, cls:p.cash<0?"neg":""},
    {l:"資產", v:d.totalAssets},
    {l:"負債", v:-d.totalLiabilities, cls:"neg"},
    {l:"淨值", v:d.netWorth, cls:d.netWorth>=0?"":"neg", total:true}
  ]));
  fin.appendChild(g); box.appendChild(fin);

  /* 自由／圓夢進度條 */
  var fr=el("div","freedom");
  var ratio=Math.min(1, ledger.freedomRatio(p));
  var t1=el("div"); t1.style.cssText="display:flex;justify-content:space-between;font-size:12px";
  t1.appendChild(el("b",null,p.playerStage==="OUTER"?"圓夢進度":T("sheet.freedom")));
  t1.appendChild(el("b","gold", p.playerStage==="OUTER" ? (p.dreamProgress+" / "+S.config.dreamCost+" 點") : util.pct(ratio,0)));
  fr.appendChild(t1);
  var bar=el("div","bar"), fill=el("i");
  fill.style.width=(p.playerStage==="OUTER" ? (p.dreamProgress/S.config.dreamCost*100) : ratio*100)+"%";
  bar.appendChild(fill); fr.appendChild(bar);
  var cap=el("div","cap");
  if(p.playerStage==="OUTER"){
    var narr = dream ? Math.round(p.dreamProgress*dream.narrativeTotal/S.config.dreamCost)+" / "+dream.narrativeTotal+" "+dream.narrativeUnit : "";
    cap.appendChild(el("span",null,narr));
    cap.appendChild(el("span",null,"下一段 "+M(S.config.dreamProgressBasePrice*(p.dreamProgress+1))));
  } else {
    cap.appendChild(el("span",null,term("PASSIVE_INCOME")+" "+M(d.passiveIncome)));
    cap.appendChild(el("span",null,"目標 "+M(d.totalExpenses)));
  }
  fr.appendChild(cap);
  // V11：獲勝＝夢想集滿 ＋ 幸福感達門檻，兩個條件都要看得到
  var needW=E.winWellbeingMin(S);
  if(needW>0){
    var haveW=ui.wellbeing(p), okD=p.dreamProgress>=S.config.dreamCost, okW=haveW>=needW;
    var wl=el("div"); wl.style.cssText="display:flex;justify-content:space-between;font-size:13px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2)";
    wl.appendChild(el("b",null,"獲勝條件"));
    var wr=el("span");
    wr.innerHTML="夢想 <b class='"+(okD?"pos":"")+"'>"+p.dreamProgress+"／"+S.config.dreamCost+"</b>"+
      "　＋　幸福感 <b class='"+(okW?"pos":"neg")+"'>"+haveW+"／"+needW+"</b>";
    wr.className="wbClick"; wr.style.cursor="pointer";
    wr.title="點擊看幸福感／品格／夢想的積累明細";
    wr.onclick=function(){ ui.showWellbeingDetail(p); };
    wl.appendChild(wr); fr.appendChild(wl);
    if(okD && !okW){
      var hint=el("div",null,"夢想已集滿，但幸福感還差 "+(needW-haveW)+" 點——去商城做點對生活與家人有意義的事吧。");
      hint.style.cssText="font-size:12.5px;color:var(--gold);margin-top:3px;line-height:1.4";
      fr.appendChild(hint);
    }
  }
  box.appendChild(fr);

  /* 畢業／重返（僅本人） */
  if(isMe && p.playerStage==="OUTER" && !p.bankrupt){
    var rs=el("div","sec");
    var mult2=E.cfg(S,"returnSalaryMult"); if(mult2===undefined) mult2=0.9;
    var rb2=el("button","act","🔙 重返職場（薪資 "+Math.round(mult2*100)+"%・停走 1 輪・進度保留）");
    rb2.style.width="100%"; rb2.disabled=!canAct;
    rb2.onclick=function(){
      var ov=el("div","overlay"), bx=el("div","sheetbox"); bx.style.maxWidth="420px";
      bx.appendChild(el("h2",null,"自願重返職場？"));
      bx.appendChild(el("div","flavor","薪資恢復為離職時的 "+Math.round(mult2*100)+"%、夢想維持費停扣、停走 1 輪。夢想進度 "+p.dreamProgress+"／"+S.config.dreamCost+" 會保留。"));
      var oo=el("div","opts");
      oo.appendChild(ui.optBtn("確定重返","先退一步，把引擎修好再來",function(){ ov.remove(); ui.dispatch({type:"RETURN_TO_WORK",playerId:0,payload:null}); }));
      oo.appendChild(ui.optBtn(T("act.close"),null,function(){ ov.remove(); }));
      bx.appendChild(oo); ov.appendChild(bx); $("overlays").appendChild(ov);
    };
    rs.appendChild(rb2); box.appendChild(rs);
  }
  if(isMe && p.playerStage==="INNER" && p.financiallyFree){
    var gs=el("div","sec"); gs.style.background="rgba(53,196,168,.08)";
    var upk=dream?E.cfg(S,"dreamUpkeepMonthly"):0;
    var proj=util.r2(d.passiveIncome-d.totalExpenses-upk);
    gs.appendChild(el("div","gold","🎉 已財務自由　進外圈後月現金流 "+(proj>=0?"+":"")+M(proj)));
    var gb=el("button","bigbtn","辭職進入自由圈"); gb.style.cssText="width:100%;padding:10px;margin-top:6px;font-size:15px";
    gb.disabled=!canAct;
    gb.onclick=function(){ ui.dispatch({type:"GRADUATE_NOW",playerId:0,payload:null}); };
    gs.appendChild(gb); box.appendChild(gs);
  }

  /* 資產細項｜負債細項（行內 賣／還） */
  var det=el("div","sec");
  var dg=el("div","twoCol");
  var aCol=el("div");
  aCol.appendChild(el("h4",null,"資產細項")).style.cssText="margin:0 0 3px;font-size:var(--fs-xs);letter-spacing:.1em;color:var(--tx3)";
  var at=el("table","dtb");
  var nonStock=p.assets.filter(function(a){ return a.kind!=="STOCK"; });
  if(nonStock.length){ var ah=el("tr");
    ["名稱","現值","月現金流",""].forEach(function(hh){ ah.appendChild(el("th",null,hh)); });
    at.appendChild(ah); }
  var hasStockAsset=p.assets.some(function(a){ return a.kind==="STOCK"; });
  if(!nonStock.length && !hasStockAsset) aCol.appendChild(el("div",null,"（無）")).style.cssText="font-size:13px;color:var(--tx3)";
  nonStock.forEach(function(a){
    var tr=el("tr");
    var td1=el("td"); var nmS=el("span",null,a.name); nmS.style.cursor="pointer"; nmS.title="點擊看操作";
    nmS.onclick=function(){ if(a.kind==="P2P_LOAN"){ ui.toast("P2P 債權每輪自動回收本息","warn"); return; } ui.showAsset(a); };
    td1.appendChild(nmS); tr.appendChild(td1);
    tr.appendChild(el("td","num",M(a.marketValue)));
    var td3=el("td","num "+(a.monthlyIncome>=0?"pos":"neg"),(a.monthlyIncome>=0?"+":"")+M(a.monthlyIncome));
    tr.appendChild(td3);
    var td4=el("td");
    if(isMe && a.kind!=="P2P_LOAN"){
      var sb=el("button","mini","賣"); sb.disabled=!canAct;
      sb.onclick=function(){
        var mult=E.sellMult(S,a), est=util.r2(a.marketValue*mult);
        var lk=p.liabilities.filter(function(x){return x.instanceId===a.linkedLiabilityId;})[0];
        var ov=el("div","overlay"), bx=el("div","sheetbox"); bx.style.maxWidth="400px";
        bx.appendChild(el("h2",null,"賣出「"+a.name+"」？"));
        bx.appendChild(el("div","flavor","約可得 "+M(est)+(lk?"（將先清償連結貸款 "+M(lk.principal)+"）":"")+"，月現金流 "+(a.monthlyIncome>=0?"−":"+")+M(Math.abs(a.monthlyIncome))+"。"));
        var oo=el("div","opts");
        oo.appendChild(ui.optBtn("確定賣出",null,function(){ ov.remove();
          ui.dispatch({type:"SELL_ASSET",playerId:0,payload:{assetId:a.instanceId}}); },true));
        oo.appendChild(ui.optBtn(T("act.close"),null,function(){ ov.remove(); }));
        bx.appendChild(oo); ov.appendChild(bx); $("overlays").appendChild(ov);
      };
      td4.appendChild(sb);
    }
    tr.appendChild(td4); at.appendChild(tr);
  });
  // 八期：股票在下方「庫存股票」逐檔操作，這裡補一列合計，避免與「收支與資產明細」不一致
  var stockAssets=p.assets.filter(function(a){ return a.kind==="STOCK"; });
  if(stockAssets.length){
    var sv=0, si=0, su=0;
    stockAssets.forEach(function(a){ sv+=a.marketValue; si+=a.monthlyIncome||0; su+=a.units||0; });
    var str=el("tr");
    var std1=el("td"); var sspan=el("span",null,"📈 股票合計（"+stockAssets.length+" 筆／"+su+" 張）");
    sspan.style.color="var(--tx2)"; std1.appendChild(sspan); str.appendChild(std1);
    str.appendChild(el("td","num",M(util.r2(sv))));
    str.appendChild(el("td","num "+(si>=0?"pos":"neg"),(si>=0?"+":"")+M(util.r2(si))));
    var std4=el("td"); var sgo=el("span",null,"↓"); sgo.title="逐檔買賣請見下方「庫存股票」";
    sgo.style.cssText="color:var(--tx3);font-size:12px"; std4.appendChild(sgo); str.appendChild(std4);
    at.appendChild(str);
    if(!nonStock.length){ // 只有股票時，先前會顯示「（無）」造成不一致
      var ah2=el("tr"); ["名稱","現值","月現金流",""].forEach(function(hh){ ah2.appendChild(el("th",null,hh)); });
      at.insertBefore(ah2, at.firstChild);
    }
  }
  aCol.appendChild(at); dg.appendChild(aCol);
  var lCol=el("div");
  lCol.appendChild(el("h4",null,"負債細項")).style.cssText="margin:0 0 3px;font-size:var(--fs-xs);letter-spacing:.1em;color:var(--tx3)";
  var lt=el("table","dtb");
  if(p.liabilities.length){ var lh=el("tr");
    ["名稱","餘額","月付",""].forEach(function(hh){ lh.appendChild(el("th",null,hh)); });
    lt.appendChild(lh); }
  if(!p.liabilities.length) lCol.appendChild(el("div",null,"（無）")).style.cssText="font-size:13px;color:var(--tx3)";
  p.liabilities.forEach(function(l){
    var tr=el("tr");
    var td1=el("td"); var nmL=el("span",null,l.name); nmL.style.cursor="pointer"; nmL.title="點擊看操作";
    nmL.onclick=function(){ ui.showLiability(l); };
    td1.appendChild(nmL); tr.appendChild(td1);
    tr.appendChild(el("td","num neg",M(l.principal)));
    tr.appendChild(el("td","num neg","−"+M(l.monthlyPayment)));
    var td4=el("td");
    if(isMe && l.kind!=="P2P"){
      var rbtn=el("button","mini","還"); rbtn.disabled=!canAct;
      rbtn.onclick=function(){ ui.showLiability(l); };
      td4.appendChild(rbtn);
    }
    tr.appendChild(td4); lt.appendChild(tr);
  });
  lCol.appendChild(lt); dg.appendChild(lCol);
  det.appendChild(dg); box.appendChild(det);

  /* 庫存股票（行內買賣） */
  if(S.enabledModules.indexOf("M1")>=0){
    var stx=el("div","sec");
    var sh=el("div"); sh.style.cssText="display:flex;justify-content:space-between;align-items:baseline";
    sh.appendChild(el("h4",null,"庫存股票"));
    var more=el("span",null,"進階下單（融資）›"); more.style.cssText="color:var(--gold);font-size:10.5px;cursor:pointer";
    more.onclick=function(){ ui.showStockMarket(); }; sh.appendChild(more);
    stx.appendChild(sh);
    var tb=el("table","dtb");
    var hdr=el("tr");
    ["股票","現價","張","損益%","", "維持率"].forEach(function(hh){ hdr.appendChild(el("th",null,hh)); });
    tb.appendChild(hdr);
    var qtyMap={};   // DOM 存區域 map（§1.9-1）
    ns.content.stockDefs.forEach(function(def){
      var price=S.stockPrices[def.symbol]||def.face;
      var cashPos=p.assets.filter(function(a){return a.kind==="STOCK"&&a.symbol===def.symbol&&!(a.flags&&a.flags.margin);})[0];
      // 現股列
      var tr=el("tr");
      tr.appendChild(el("td",null,E.stockName(S,def.symbol).replace(/（.*）| ETF/,"")));
      tr.appendChild(el("td","num",M(price)));
      tr.appendChild(el("td","num",cashPos?String(cashPos.units):"0"));
      var plPct = cashPos&&cashPos.costBasis>0 ? (cashPos.marketValue-cashPos.costBasis)/cashPos.costBasis : 0;
      tr.appendChild(el("td","num "+(plPct>=0?"pos":"neg"), cashPos?((plPct>=0?"+":"")+util.pct(plPct,1)):"—"));
      var tdOp=el("td");
      if(isMe){
        var q=el("input","qty"); q.type="number"; q.min=1; q.value=1; qtyMap[def.symbol]=q;
        var bb=el("button","mini gold","買"), sb2=el("button","mini","賣"), ab=el("button","mini","全賣");
        bb.disabled=sb2.disabled=ab.disabled=!canAct;
        if(!cashPos){ sb2.disabled=ab.disabled=true; }
        bb.onclick=function(){ var u=Math.max(1,(+q.value|0));
          ui.spendGuard(util.r2(p.cash-price*u), function(){
            ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"buy",units:u,margin:false}}); }); };
        sb2.onclick=function(){ var u=Math.max(1,(+q.value|0));
          ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",units:Math.min(u,cashPos?cashPos.units:0)}}); };
        ab.onclick=function(){ ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",units:cashPos.units}}); };
        tdOp.appendChild(q); tdOp.appendChild(bb); tdOp.appendChild(sb2); tdOp.appendChild(ab);
      } else tdOp.appendChild(el("span","num",cashPos?M(cashPos.marketValue):""));
      tr.appendChild(tdOp);
      tr.appendChild(el("td","num","—"));   // 現股無維持率
      tb.appendChild(tr);
      // 融資部位：各自一列（獨立維持率＋平倉）
      p.assets.filter(function(a){return a.kind==="STOCK"&&a.symbol===def.symbol&&a.flags&&a.flags.margin;})
        .forEach(function(mp){
          var mtr=el("tr");
          mtr.appendChild(el("td",null,"└ 融資"));
          mtr.appendChild(el("td","num",""));
          mtr.appendChild(el("td","num",String(mp.units)));
          var mpl = mp.costBasis>0 ? (mp.marketValue-mp.costBasis)/mp.costBasis : 0;
          mtr.appendChild(el("td","num "+(mpl>=0?"pos":"neg"),(mpl>=0?"+":"")+util.pct(mpl,1)));
          var mOp=el("td");
          if(isMe){
            var cb=el("button","mini","平倉"); cb.disabled=!canAct;
            cb.onclick=function(){
              var ov=el("div","overlay"), bx=el("div","sheetbox"); bx.style.maxWidth="400px";
              bx.appendChild(el("h2",null,"融資平倉？"));
              bx.appendChild(el("div","flavor","整筆賣出 "+mp.units+" 張（市值 "+M(mp.marketValue)+"），價金優先清償融資餘額。"));
              var oo=el("div","opts");
              oo.appendChild(ui.optBtn("確定平倉",null,function(){ ov.remove();
                ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",assetId:mp.instanceId}}); },true));
              oo.appendChild(ui.optBtn(T("act.close"),null,function(){ ov.remove(); }));
              bx.appendChild(oo); ov.appendChild(bx); $("overlays").appendChild(ov);
            };
            mOp.appendChild(cb);
          } else mOp.appendChild(el("span","num",M(mp.marketValue)));
          mtr.appendChild(mOp);
          var mLoan=p.liabilities.filter(function(l){return l.instanceId===mp.linkedLiabilityId;})[0];
          var mtxt="—";
          if(mLoan && mLoan.principal>0.01){
            var mr=mp.marketValue/mLoan.principal, near=mr<S.config.marginCallLevel*1.15;
            mtxt=Math.round(mr*100)+"%"+(near?"⚠":"");
          }
          mtr.appendChild(el("td","num"+(mtxt.indexOf("⚠")>=0?" neg":""),mtxt));
          tb.appendChild(mtr);
        });
    });
    stx.appendChild(tb); box.appendChild(stx);
  }

  /* 品格已於七期改為數字，併入上方玩家資訊列（幸福感之後） */
};

/* ============================ 中央互動區 ================================ */
// 決策 modal 開關（#center 已是 fixed 全螢幕；空的時候不可蓋住畫面）
ui.modalOn = function(on){ var c=$("center"); c.classList.toggle("on", !!on); };
ui.renderCenter = function(){
  var S=ui.S, c=$("center"), bc=$("boardCenter"), tray=$("bkTray");
  if(ui._autoRollT){ clearInterval(ui._autoRollT); ui._autoRollT=null; }   // 重繪即重置自動骰計時
  c.innerHTML=""; bc.innerHTML=""; ui.modalOn(false);
  tray.classList.add("hide"); tray.innerHTML="";
  if(S.over){ ui.showReport(); return; }
  var p=E.activePlayer(S);

  // NPC 思考中：留在盤面中央，不擋畫面
  if(p.isNPC){
    var think=el("div","npcThink");
    think.appendChild(el("b",null,p.name+" 思考中…"));
    var per=ns.content.personalityById[p.npcPersonality];
    think.appendChild(el("div",null,per.name+"　現金 "+M(p.cash)+"　被動 "+M(p.derived.passiveIncome)));
    bc.appendChild(think); return;
  }

  // 決策卡／記帳：置中 modal
  if(S.phase==="DECISION" || S.phase==="BANKRUPTCY"){ ui.modalOn(true); ui.decisionCard(S,p,S.pendingDecision); return; }
  if(S.phase==="BOOKKEEPING"){ ui.modalOn(true); ui.renderBookkeeping(S,p); return; }

  // 擲骰／結束回合：盤面中央
  if(S.phase==="ROLL"){
    var d=el("div","num"); d.id="dice"; d.textContent="🎲";
    var b=el("button","bigbtn",T("act.roll")); b.onclick=function(){ ui.rollDice(); };
    bc.appendChild(d); bc.appendChild(b);
    // 六期：閒置 3 秒自動擲骰（任何操作會重繪並重新計時；0 = 關閉）
    // 七期：任何視窗開啟時（說明、借款、股市、調參、薪資單⋯⋯）暫停倒數，關閉後重新滿額起算
    var ars=E.cfg(S,"autoRollSec"); if(ars===undefined) ars=3;
    if(ars>0 && !p.isNPC){
      var left=ars;
      var busyUI=function(){
        return ($("overlays")&&$("overlays").children.length>0) ||
               $("center").classList.contains("on") ||
               ($("devpanel")&&$("devpanel").classList.contains("on")) ||
               ui.busy;
      };
      b.textContent=T("act.roll")+(busyUI()?"":"（"+left+"）");
      ui._autoRollT=setInterval(function(){
        if(busyUI()){ left=ars; b.textContent=T("act.roll"); return; }
        left--;
        if(left<=0){ clearInterval(ui._autoRollT); ui._autoRollT=null; ui.rollDice(); }
        else b.textContent=T("act.roll")+"（"+left+"）";
      },1000);
    }
    return;
  }
  if(S.phase==="READY_END"){
    var done=el("div","npcThink");
    done.appendChild(el("b",null,"這回合處理完了"));
    done.appendChild(el("div",null,"可檢視財報或操作部位，然後結束回合"));
    var b2=el("button","bigbtn",T("act.end")); b2.onclick=function(){ ui.dispatch({type:"END_TURN",playerId:0,payload:null}); };
    bc.appendChild(done); bc.appendChild(b2); return;
  }
};

function cardFace(card){
  var wrap=el("div");
  wrap.appendChild(el("h3",null,card.title||card.name));
  if(card.flavor) wrap.appendChild(el("div","flavor",card.flavor));
  return wrap;
}
function eduBox(card){ if(card && card.eduNote){ var e=el("div","edu",card.eduNote); return e; } return null; }
function optBtn(label, sub, fn, rec){
  var b=el("button","opt"+(rec?" rec":"")); b.appendChild(el("div",null,label));

// 把選項說明中的「金錢情境」數字（千元）轉成元顯示，避開 ×倍數、回合數、品格值
ui.yuanizeSub = function(sub){
  if(!sub) return sub;
  return sub.replace(/(投入|每月支出|花費|支出|收|需|花)\s*([+-]?\d+)/g, function(m, pre, num){
    var sign = num.charAt(0)==="+" ? "+" : "";
    return pre+" "+sign+M(parseInt(num,10));
  });
};

/* 六期：把 DSL 效果翻成白話，附在選項下——卡面沒講清楚的，按鈕講清楚 */
ui.effectSummary = function(effects){
  if(!effects || !effects.length) return "";
  var out=[];
  effects.forEach(function(ef){
    var who = ef.target==="all"?"全體 ":(ef.target==="others"?"其他玩家 ":"");
    switch(ef.op){
      case "CASH_DELTA": out.push(who+"現金 "+(ef.amount>=0?"+":"−")+M(Math.abs(ef.amount))); break;
      case "ADD_RECURRING_EXPENSE": out.push(who+"每月支出 +"+M(ef.amount)+(ef.durationTurns?"（"+ef.durationTurns+" 輪）":"（永久）")); break;
      case "SALARY_MULT": { var pc=Math.round((ef.factor-1)*100);
        out.push(who+"薪資 "+(pc>=0?"+":"")+pc+"%"); break; }
      case "ASSET_VALUE_MULT": out.push((ef.filter&&ef.filter.kind?({REALESTATE:"房產",STOCK:"股票",BUSINESS:"事業",STARTUP:"新創"}[ef.filter.kind]||"資產"):"資產")+"估值 ×"+ef.factor); break;
      case "ASSET_INCOME_MULT": out.push((ef.filter&&ef.filter.kind?({REALESTATE:"租金",BUSINESS:"分紅"}[ef.filter.kind]||"資產收入"):"資產收入")+" ×"+ef.factor+(ef.durationTurns?"（"+ef.durationTurns+" 輪）":"")); break;
      case "SKIP_TURNS": out.push("停走 "+(ef.turns||1)+" 回合"); break;
      case "ADD_CHILD": out.push("家庭新成員（每月養育支出增加）"); break;
      case "GRANT_VIRTUE": out.push("品格 +"+(ef.amount||1)); break;
      case "DIVIDEND_BONUS": out.push("配息加發 ×"+ef.mult+(ef.durationTurns?"（"+ef.durationTurns+" 輪）":"")); break;
      case "STOCK_PRICE_SET": out.push("股價變動"); break;
    }
  });
  return out.join("、");
};
ui.optSub = function(op){   // 內容 sub＋自動效果摘要（避免重複：sub 已含金額者仍附一行完整效果）
  var base = ui.yuanizeSub(op.sub)||"";
  var es = ui.effectSummary(op.effects);
  if(!es) return base;
  return base ? base+"　▸ "+es : "▸ "+es;
};

        function(){ ui.showP2PPanel(true); }));
    o8.appendChild(optBtn(T("bank.out"),"退出這一局",function(){ decide("declare"); }));

    card.appendChild(oO); c.appendChild(card); return;
  }

  // ACK 類（市場卡、人生事件、聖地、失業結果）
  card.appendChild(cardFace(cd||{title:"事件"}));
  if(cd){ var eb5=eduBox(cd); if(eb5) card.appendChild(eb5); }
  // V11.1：醫療／意外事件的理賠明細——原價、折抵、理賠、實際支付、省下多少
  if(d.claim && d.claim.gross>0) card.appendChild(ui.claimBox(S,d.claim));
  if(d.impact && d.impact.length){
    var acc={INCOME_ACTIVE:"主動收入",INCOME_PASSIVE:"被動收入",EXPENSE:"支出",ASSET:"資產市值",LIABILITY:"負債",CASH:"現金"};
    var wrap=el("div"); wrap.style.marginTop="8px";
    var tgl=el("button","act","查看對你的實際影響"); tgl.style.width="100%";
    var body=el("div"); body.style.display="none"; body.style.marginTop="8px";

      kv.appendChild(el("div","v num "+(it.delta>=0?"pos":"neg"),(it.delta>=0?"+":"")+M(it.delta)));

  if(d.layoff){ card.appendChild(el("h3",null,T("layoff.title"))); card.appendChild(el("div","flavor","支付 "+M(d.layoff.cost)+"，並停走 "+d.layoff.skip+" 回合。")); }
  if(d.site){ card.appendChild(el("div","edu",T("outer.site"))); }

  card.appendChild(o9); c.appendChild(card);
};

ui.describeEffect = function(e){

ui.buyRealEstate = function(S,p,d,cd,card,c,decide){
  var pl=cd.payload, im=S.config.assetIncomeMult;
  var net=util.r2(pl.monthlyRent*im - pl.monthlyCost);
  var allowLoan = d.allowLoan && E.canUseLoan(S);
  var state={ mode: allowLoan?"loan":"cash", ltv: allowLoan?Math.min(1-pl.downPayment/pl.price, d.maxLTV):0 };
  var kv=el("div","kv");
  var grossYield = pl.price>0 ? net*12/pl.price : 0;
  kv.innerHTML="<div class='k'>總價</div><div class='v num'>"+M(pl.price)+"</div>"+
    "<div class='k'>月租金（×係數 "+im+"）</div><div class='v num pos'>+"+M(pl.monthlyRent*im)+"</div>"+
    "<div class='k'>持有成本</div><div class='v num neg'>−"+M(pl.monthlyCost)+"</div>"+
    "<div class='k'>年化租金報酬率</div><div class='v num "+(grossYield>=0.04?"pos":"")+"'>"+util.pct(grossYield,1)+"</div>";
  card.appendChild(kv);
  var modeRow=el("div","tabs");
  var tCash=el("button","tab"+(state.mode==="cash"?" on":""),T("dec.buyCash"));
  var tLoan=el("button","tab"+(state.mode==="loan"?" on":""),T("dec.buyLoan"));
  if(allowLoan){ modeRow.appendChild(tCash); modeRow.appendChild(tLoan); card.appendChild(modeRow); }
  var slid=el("div","slider");
  var rng=el("input"); rng.type="range"; rng.min=0; rng.max=Math.round(d.maxLTV*100); rng.step=5; rng.value=Math.round(state.ltv*100);
  var slLbl=el("div"); slLbl.style.cssText="font-size:12px;color:var(--tx2)";
  slid.appendChild(slLbl); slid.appendChild(rng);
  var pv=el("div","preview");
  function refresh(){
    var loan = state.mode==="loan" ? util.r2(pl.price*state.ltv) : 0;
    var down = util.r2(pl.price-loan);

ui.makeDraggable = function(pc, idx, zones){
  var startX,startY,ghost,moved;
  function down(e){
    e.preventDefault();
    var pt=e.touches?e.touches[0]:e; startX=pt.clientX; startY=pt.clientY; moved=false; ghost=null;
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    document.addEventListener("touchmove",move,{passive:false}); document.addEventListener("touchend",up);
  }
  function ensureGhost(){
    if(ghost) return;
    ghost=pc.cloneNode(true); ghost.className="pcard drag";
    var r=pc.getBoundingClientRect();
    ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px"; ghost.style.width=r.width+"px";
    document.body.appendChild(ghost); pc.style.opacity=0.3;
  }
  function move(e){
    if(e.cancelable) e.preventDefault();
    var pt=e.touches?e.touches[0]:e, dx=pt.clientX-startX, dy=pt.clientY-startY;
    if(!moved && Math.abs(dx)+Math.abs(dy)>6) moved=true;
    if(!moved) return;
    ensureGhost();
    ghost.style.transform="translate("+dx+"px,"+dy+"px) scale(1.05)";
    zones.querySelectorAll("[data-zone]").forEach(function(z){ var r=z.getBoundingClientRect();
      z.classList.toggle("dropzone", pt.clientX>=r.left&&pt.clientX<=r.right&&pt.clientY>=r.top&&pt.clientY<=r.bottom); });
  }
  function up(e){
    document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
    document.removeEventListener("touchmove",move); document.removeEventListener("touchend",up);
    var pt=e.changedTouches?e.changedTouches[0]:e, hit=null;
    zones.querySelectorAll("[data-zone]").forEach(function(z){ var r=z.getBoundingClientRect();
      if(pt.clientX>=r.left&&pt.clientX<=r.right&&pt.clientY>=r.top&&pt.clientY<=r.bottom) hit=z.dataset.zone;
      z.classList.remove("dropzone"); });
    if(ghost){ ghost.remove(); ghost=null; } pc.style.opacity=1;
    if(moved){ if(hit) ui.dispatch({type:"CLASSIFY_ENTRY",playerId:0,payload:{taskIdx:idx,quadrant:hit}}); }
    else { ui._bkSel = (ui._bkSel===idx ? null : idx); ui.render(); }
  }
  pc.addEventListener("mousedown",down); pc.addEventListener("touchstart",down,{passive:false});
};

/* §3.1/§3.2：機會處置按鈕——買下／發起拍賣／找人合資／跳過 */
ui.oppDealBtns = function(cd){
  var S=ui.S, me=S.players[S.activePlayerIdx], out=[];
  var others=S.players.filter(function(x){return x.id!==me.id && !x.bankrupt;});
  if(!others.length) return out;

  out.push(optBtn("發起拍賣","所有玩家密封出價一輪，最高價得標，價金歸你",function(){
    ui.dispatch({type:"START_OPP_AUCTION",playerId:S.activePlayerIdx,payload:{cardId:cd.id}});
  }));
  if(ui.showJvPanel) out.push(optBtn("找人合資","選一位夥伴按出資比共同持有，各自持份獨立",function(){ ui.showJvPanel(cd); }));

  return out;
};

  rngR.min=Math.round((S.macro.baseRate+0.01)*1000); rngR.max=Math.round(maxR*1000); rngR.step=5;
  var lblR=el("div"); lblR.style.cssText="font-size:12px;color:var(--tx2)";

  var pv=el("div","preview"); box.appendChild(pv);

  var goBtn=optBtn("提出","",function(){

  hdr.appendChild(el("h2",null,"股市"));
  hdr.appendChild(el("b","gold","可用現金 "+M(p.cash)));
  box.appendChild(hdr);
  box.appendChild(el("div","sub", canTrade?"點各檔可買進或賣出（現股）；走勢為近 12 輪":"現在不是你的操作時機，僅供查看"));
  var list=el("div");
  function spark(hist, up){
    if(!hist || hist.length<2) return "";
    var W=120,H=34,mn=Math.min.apply(null,hist),mx=Math.max.apply(null,hist),rng=(mx-mn)||1;
    var pts=hist.map(function(v,i){ var x=i*(W/(hist.length-1)), y=H-2-((v-mn)/rng)*(H-4); return x.toFixed(1)+","+y.toFixed(1); }).join(" ");
    var col=up?"#35C4A8":"#F0803C";
    return "<svg width='"+W+"' height='"+H+"' style='display:block'><polyline points='"+pts+"' fill='none' stroke='"+col+"' stroke-width='1.6'/></svg>";
  }
  ns.content.stockDefs.forEach(function(def){
    var price=S.stockPrices[def.symbol]||def.face;
    var hist=(S.stockHistory&&S.stockHistory[def.symbol])||[def.face];
    var cashPos=p.assets.filter(function(a){return a.kind==="STOCK"&&a.symbol===def.symbol&&!(a.flags&&a.flags.margin);})[0];
    var mLots=p.assets.filter(function(a){return a.kind==="STOCK"&&a.symbol===def.symbol&&a.flags&&a.flags.margin;});
    var canMargin = E.canUseAdvanced(S) && S.enabledModules.indexOf("M1")>=0;
    var maxU=Math.floor(p.cash/price);
    var row=el("div","sec"); row.style.cssText="padding:11px 4px";
    var top=el("div"); top.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:10px";
    var chg=util.r2(price-def.face), chgP=def.face>0?chg/def.face:0;
    var recent = hist.length>=2 ? (hist[hist.length-1]-hist[hist.length-2]) : 0;
    var left=el("div");
    left.innerHTML="<b>"+E.stockName(S,def.symbol)+"</b><br><span class='num' style='font-size:12px'>"+M(price)+" / 張　"+
      "<span class='"+(chg>=0?"pos":"neg")+"'>"+(chg>=0?"▲":"▼")+util.pct(Math.abs(chgP),1)+"</span>　殖利率 "+util.pct(E.stockYield(S,def),2)+"／月</span>";
    var sp=el("div"); sp.innerHTML=spark(hist, recent>=0);
    top.appendChild(left); top.appendChild(sp); row.appendChild(top);
    if(cashPos){ var h=el("div"); h.style.cssText="color:var(--tx2);font-size:13px;margin-top:3px";
      var pl=util.r2(cashPos.marketValue-cashPos.costBasis);
      h.innerHTML="現股 "+cashPos.units+" 張　市值 "+M(cashPos.marketValue)+"　損益 <span class='"+(pl>=0?"pos":"neg")+"'>"+(pl>=0?"+":"")+M(pl)+"</span>";
      row.appendChild(h); }
    mLots.forEach(function(lot){
      var h2=el("div"); h2.style.cssText="color:var(--tx2);font-size:13px;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap";
      var mLoan = lot.linkedLiabilityId ? p.liabilities.filter(function(x){return x.instanceId===lot.linkedLiabilityId;})[0] : null;
      var pl2=util.r2(lot.marketValue-lot.costBasis);
      var mtxt="└ 融資 "+lot.units+" 張　市值 "+M(lot.marketValue)+"　損益 <span class='"+(pl2>=0?"pos":"neg")+"'>"+(pl2>=0?"+":"")+M(pl2)+"</span>";
      if(mLoan && mLoan.kind==="MARGIN"){ var mr=lot.marketValue/Math.max(0.01,mLoan.principal);
        var near=mr < S.config.marginCallLevel*1.15;
        mtxt+="　借 "+M(mLoan.principal)+"　維持率 <b class='"+(near?"neg":"pos")+"'>"+Math.round(mr*100)+"%</b>"+
          (near?"（接近斷頭 "+Math.round(S.config.marginCallLevel*100)+"%）":""); }
      var sp2=el("span"); sp2.innerHTML=mtxt; h2.appendChild(sp2);
      if(canTrade){ var cl=el("button","mini","平倉"); cl.onclick=function(){
        if(!confirm("賣出整筆融資部位並清償融資借款？")) return;
        ov.remove(); ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",units:lot.units,assetId:lot.instanceId}}); };
        h2.appendChild(cl); }
      row.appendChild(h2);
    });
    if(canTrade){
      var useMargin={on:false};
      var ctl=el("div"); ctl.style.cssText="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap";
      var qty=el("input"); qty.type="number"; qty.min=1; qty.value=Math.max(1,Math.min(maxU,Math.floor(maxU/3)))||1;
      qty.style.cssText="width:78px;background:var(--ink);border:1px solid var(--line2);border-radius:8px;color:var(--tx);padding:7px;font-family:var(--mono)";
      var hint=el("span",null,"可買 "+maxU+" 張"); hint.style.cssText="color:var(--tx3);font-size:11px";
      var mTab=null;
      if(canMargin){ mTab=el("button","tab","融資"); mTab.style.cssText="padding:5px 10px;font-size:12px";
        mTab.onclick=function(){ useMargin.on=!useMargin.on; mTab.className="tab"+(useMargin.on?" on":"");
          var mx=useMargin.on?Math.floor(p.cash/(price*S.config.marginRatio)):Math.floor(p.cash/price);
          hint.textContent=(useMargin.on?"融資可買 ":"可買 ")+mx+" 張"; }; }
      var buy=el("button","act","買進"); buy.onclick=function(){ var u=Math.max(1,Math.floor(+qty.value||1));
        var per=useMargin.on?price*S.config.marginRatio:price;
        if(per*u>p.cash){ ui.toast("現金不足","warn"); return; }
        var cashAfter=util.r2(p.cash-per*u);
        var doBuy=function(){ ov.remove(); ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"buy",units:u,margin:useMargin.on}}); };
        var goP=function(){ ui.spendGuard(cashAfter, doBuy); };
        if(useMargin.on) ui.marginGuard(def, goP); else goP(); };
      ctl.appendChild(el("span",null,"張數")); ctl.appendChild(qty); if(mTab) ctl.appendChild(mTab); ctl.appendChild(hint); ctl.appendChild(buy);
      if(cashPos){ var sell=el("button","act","賣出（現股）"); sell.onclick=function(){ var u=Math.max(1,Math.floor(+qty.value||1));
        ov.remove(); ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",units:u}}); };
        ctl.appendChild(sell);
        var sellAll=el("button","act","全賣"); sellAll.onclick=function(){
          ov.remove(); ui.dispatch({type:"TRADE_STOCK",playerId:0,payload:{symbol:def.symbol,side:"sell",units:cashPos.units}}); };
        ctl.appendChild(sellAll); }
      row.appendChild(ctl);
    }
    list.appendChild(row);
  });
  box.appendChild(list);
  var o=el("div","opts"); o.appendChild(optBtn(T("act.close"),null,function(){ ov.remove(); }));
  box.appendChild(o); ov.appendChild(box); $("overlays").appendChild(ov);
};

})(ns);
</script>
<script>
(function(ns){
"use strict";
var util=ns.util, ledger=ns.ledger, E=ns.engine, ui=ns.ui;
var $=function(id){ return document.getElementById(id); };
var el=function(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e; };
var T=ui.t, M=util.money, optBtn=ui.optBtn;

/* ============================ dispatch 與演出 =========================== */
ui.feed = [];
ui.lastAct = {};
ui.announce = function(msg, pid){
  ui.feed.push({turn: ui.S?ui.S.turnNumber:0, msg:msg, pid:(pid===undefined?null:pid)});
  if(ui.feed.length>40) ui.feed.shift();
  if(pid!==undefined && pid!==null) ui.lastAct[pid]={turn:(ui.S?ui.S.turnNumber:0), msg:msg};
};
ui.rollDice = function(){
  if(!ui.S || ui.busy) return;
  var d=$("dice");
  if(!d){ ui.dispatch({type:"ROLL_DICE",playerId:0,payload:null}); return; }
  ui.busy=true;
  var ticks=0, iv=setInterval(function(){
    d.textContent = 1+Math.floor(Math.random()*6); d.classList.add("rolling"); ticks++;
    if(ticks>=8){ clearInterval(iv); ui.busy=false; ui.dispatch({type:"ROLL_DICE",playerId:0,payload:null}); }
  }, 60);
};

ui.dispatch = function(action){
  if(!ui.S || ui.busy) return;
  try{
    ui.S.players.forEach(function(pl){ delete pl._b; delete pl._btn; pl.assets.forEach(function(a){ delete a._btn; }); }); // 防禦：清除任何誤掛到 state 的 DOM
    var res = E.apply(ui.S, action);
    if(res.rejected){ ui.toast(T("toast.rejected"),"warn"); return; }
    ui.S = res.state;
    ui.handleEvents(res.events);
    ui.render();
    ui.save();
    ui.tick();
  }catch(err){
    ui.busy=false;
    try{ ui.render(); }catch(e2){}
    ui.toast("發生錯誤，已嘗試復原（動作："+(action&&action.type||"?")+"）","warn",4500);
    if(window&&window.console) console.error("dispatch error:", err);
  }
};

ui.handleEvents = function(evs){
  var nm=function(pid){ return (ui.S.players[pid]&&ui.S.players[pid].name)||"某玩家"; };
  var me=function(pid){ return pid===0?"你":nm(pid); };
  evs.forEach(function(e){
    switch(e.type){
      case "DICE_ROLLED":
        // 八期：骰數先記著，等 MOVED 知道落點後合併成一行「擲 N 點 → 人生」
        if(e.playerId===0){ var d=$("dice"); if(d){ d.textContent=e.roll; d.classList.add("rolling"); } }
        (ui._lastRoll||(ui._lastRoll={}))[e.playerId]=e.roll;
        break;
      case "MOVED": {
        var rl=(ui._lastRoll||{})[e.playerId];
        var cl=ui.cellLabel(e.outer, e.to);
        ui.announce("🎲 "+me(e.playerId)+" 擲 "+(rl===undefined?"?":rl)+" 點 → "+(cl||"—")+(e.outer?"（夢想圈）":""));
        break; }
      case "PAYDAY_EXECUTED": if(e.playerId===0) ui.showPayslip(e.detail); break;
      case "CLASSIFY_BAD": ui.toast(T("bk.wrong"),"warn"); break;
      case "CLASSIFY_OK": ui.toast("分類正確","good"); break;
      case "MACRO_TRANSITION": { var m={RECOVERY:"復甦",BOOM:"過熱",RECESSION:"衰退",DEPRESSION:"蕭條"};
        ui.announce("景氣轉入「"+m[e.to]+"」"); ui.toast("景氣轉入："+m[e.to],"warn"); break; }
      case "RATE_REVIEW": {
        if(!e.changed){ ui.announce("央行利率檢視：基準利率維持 "+util.pct(e.newRate,2)); break; }
        var dir=e.newRate>e.oldRate?"升息":"降息";
        var mine=(e.impacts||[]).filter(function(x){return x.playerId===0;})[0];
        ui.announce("央行"+dir+"：基準利率 "+util.pct(e.oldRate,2)+" → "+util.pct(e.newRate,2)+
          (mine&&mine.delta?("　你的貸款月付 "+(mine.delta>0?"+":"")+M(mine.delta)+"／月"):""));
        // 八期：利率是全域事件，不覆蓋各玩家的「最新動作」（改由系統訊息呈現）
        var tot=(e.impacts||[]).reduce(function(a,x){return a+(x.playerId===0?x.delta:0);},0);
        ui.toast("央行"+dir+" → "+util.pct(e.newRate,2)+(tot?("　你月付 "+(tot>0?"+":"")+M(tot)):""),"warn",5000);
        break; }
      case "BLESSING_DRAWN": {
        var PZN={VIRTUE:"🌱 品格成長",DREAM:"✨ 圓夢靈感",GUARDIAN:"🤝 貴人相助",JOY:"🍰 生活小確幸",CASH:"🧧 小額紅包",NONE:"🎁"};
        var VNM={TEMPER:"修養",PRUDENCE:"理財",PARENTING:"教養",FILIAL:"孝親"};
        var dt=e.detail||""; if(e.prize==="VIRTUE" && VNM[dt]) dt=VNM[dt]+" +1";
        var bl="🎁 幸福感的回報："+(PZN[e.prize]||e.prize)+(dt?("　"+dt):"");
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:bl};
        ui.announce(me(e.playerId)+"　"+bl);
        if(e.playerId!==0) ui.toast(nm(e.playerId)+" 開出「"+(PZN[e.prize]||e.prize)+"」","good",3000);
        break; }
      case "GUARDIAN_USED": {
        var gl="🤝 貴人相助：這次「"+(e.label||"人生事件")+"」的支出減免 "+M(e.saved);
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:gl};
        ui.announce(me(e.playerId)+"　"+gl);
        if(e.playerId===0) ui.toast(gl,"good",4500);
        break; }
      case "REPAIR_EVENT": {
        var fl=T(e.flavorKey);
        var line="⚒ "+e.assetName+" 修繕支出 −"+M(e.cost)+"（"+fl+"）";
        ui.announce(me(e.playerId)+"："+line);
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:line};
        if(e.playerId===0) ui.toast(line,"warn",5000);
        break; }
      case "VACANCY_START": {
        var line2="🏚 "+e.assetName+" 空租 "+e.turns+" 期，租金 −"+M(e.income)+"／月（貸款月付照繳）";
        ui.announce(me(e.playerId)+"："+line2);
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:line2};
        if(e.playerId===0) ui.toast(line2,"warn",5500);
        break; }
      case "VACANCY_END": {
        var line3="🔑 "+e.assetName+" 恢復出租，租金 +"+M(e.income)+"／月";
        ui.announce(me(e.playerId)+"："+line3);
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:line3};
        if(e.playerId===0) ui.toast(line3,"good",4000);
        break; }
      case "BIZ_CYCLE_ADJ": {
        var up=e.delta>0;
        var line4=(up?"📈 ":"📉 ")+e.assetName+" 景氣調整 "+(up?"+":"")+M(e.delta)+"／月";
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:line4};
        if(e.playerId===0) ui.toast(line4, up?"good":"warn", 4000);
        break; }
      case "CREDIT_RATING_CHANGED": {
        var S9=ui.S, p9=S9.players[e.playerId];
        var d9=ui.creditDesc(S9,p9);
        var why=(e.reasons&&e.reasons.length)?("原因："+e.reasons.join("、")):"綜合評分變動";
        var worse={A:3,B:2,C:1}[e.to] < {A:3,B:2,C:1}[e.from];
        var msg="信用評級 "+e.from+"→"+e.to+"（"+why+"）→ 新貸款利率 "+d9.rateTxt+"、額度上限降為 "+d9.dbr+"× 月收入";
        if(e.to==="A") msg="信用評級 "+e.from+"→A（"+why+"）→ 新貸款利率 "+d9.rateTxt+"、額度上限提高為 "+d9.dbr+"× 月收入";
        ui.announce(me(e.playerId)+"的"+msg);
        ui.lastAct[e.playerId]={turn:S9.turnNumber, msg:"信用評級 "+e.from+"→"+e.to+"（"+why+"）"};
        if(e.playerId===0) ui.toast((worse?"⚠ ":"✅ ")+msg, worse?"warn":"good", 6000);
        break; }
      case "SHOCK_FORECAST": {
        ui.announce("⚠ 系統警報："+e.desc+"，預計 "+e.rounds+" 輪後衝擊市場");
        ui.broadcast("⚠ 系統警報："+e.desc, "預計 "+e.rounds+" 輪後衝擊市場——現在還來得及調整部位與現金水位","warn",7000);
        break; }
      case "SHOCK_COUNTDOWN":
        ui.announce("⚠ "+e.desc+"：距離衝擊剩 "+e.rounds+" 輪，請提前調整部位"); break;
      case "SHOCK_HIT": { var sm={RECESSION:"衰退",DEPRESSION:"蕭條"};
        ui.announce("💥 衝擊發生："+e.desc+"，景氣重挫至「"+(sm[e.toStage]||e.toStage)+"」、股市大跌");
        ui.broadcast("💥 "+e.desc, "衝擊發生：景氣重挫至「"+(sm[e.toStage]||e.toStage)+"」、股市大跌","warn",7000);
        break; }
      case "POLICY_EVENT": { var pc2=ns.content.byId[e.cardId], ex=pc2&&pc2.eduNote?("　—　"+pc2.eduNote):"";
        ui.announce("政策事件："+e.title+ex); ui.toast("政策事件："+e.title,"warn",4000); break; }
      case "ASSET_BOUGHT": { var c=ns.content.byId[e.cardId], t=c?(c.title||c.name):(e.name||"資產");
        ui.announce(me(e.playerId)+" 買了「"+t+"」", e.playerId); break; }
      case "ASSET_SOLD":
        ui.announce(me(e.playerId)+" 賣出「"+e.name+"」損益 "+(e.pl>=0?"+":"")+M(e.pl), e.playerId);
        if(e.playerId===0) ui.toast("賣出 "+e.name+"　損益 "+(e.pl>=0?"+":"")+M(e.pl), e.pl>=0?"good":"warn"); break;
      case "TRADE_DONE":
        ui.announce(nm(e.sellerId)+" 把「"+e.name+"」以 "+M(e.price)+" 轉讓給 "+nm(e.buyerId), e.sellerId);
        ui.toast("成交！「"+e.name+"」以 "+M(e.price)+" 轉讓","good",4000); break;
      case "TRADE_REJECTED":
        ui.toast(nm(e.buyerId)+" 婉拒了這筆交易","warn",3500); break;
      case "TRADE_COUNTER":   // 八期：還價視窗馬上開，不再重複 toast
        setTimeout(function(){ ui.showCounter(ui.S.pendingTrade); }, 300); break;
      case "TRADE_OFFERED":
        setTimeout(function(){ ui.showTradeOffer(ui.S.pendingTrade); }, 200); break;
      case "AUCTION_STARTED":
        ui.announce(me(e.sellerId)+" 為「"+e.title+"」發起拍賣，全場密封出價", e.sellerId); break;
      case "AUCTION_RESULT": {
        if(e.winnerId!==null && e.winnerId!==undefined){
          var wnm=nm(e.winnerId), snm=nm(e.sellerId);
          ui.announce("🔨 "+wnm+" 以 "+M(e.price)+" 拍下「"+e.title+"」，價金付給 "+snm, e.winnerId);
          ui.lastAct[e.winnerId]={turn:ui.S.turnNumber, msg:"🔨 以 "+M(e.price)+" 拍下「"+e.title+"」，價金付給 "+snm};
          ui.lastAct[e.sellerId]={turn:ui.S.turnNumber, msg:"🔨 拍出「"+e.title+"」，收得價金 "+M(e.price)};
        } else {
          ui.announce("🔨 「"+e.title+"」流標，機會回到 "+nm(e.sellerId)+" 手上", e.sellerId);
        }
        ui.showAuctionResult(e);
        break; }
      case "JV_FORMED": {
        var an=nm(e.aId), bn=nm(e.bId), sh=Math.round(e.aShare*100);
        var lineJ="🤝 "+an+"（"+sh+"%）與 "+bn+"（"+(100-sh)+"%）合資買下「"+e.title+"」";
        ui.announce(lineJ, e.aId);
        ui.lastAct[e.aId]={turn:ui.S.turnNumber, msg:"🤝 與 "+bn+" 合資（持份 "+sh+"%）「"+e.title+"」"};
        ui.lastAct[e.bId]={turn:ui.S.turnNumber, msg:"🤝 與 "+an+" 合資（持份 "+(100-sh)+"%）「"+e.title+"」"};
        break; }
      case "JV_REJECTED": {
        var why={partner:"對方評估現金水位後婉拒",self:"你的現金不足自己那份的入手門檻",
                 afford:"有一方付不起實際自備款","buy-fail":"買入未成立"}[e.reason]||"未成立";
        ui.toast("🤝 合資未成立："+why+"（機會回到你手上）","warn",4500);
        break; }
      case "TURNS_SKIPPED": {
        var ts="🏥 "+(e.label||"事件")+"：停走 "+e.turns+" 回合";
        ui.lastAct[e.playerId]={turn:ui.S.turnNumber, msg:ts};
        if(e.playerId===0) ui.toast(ts,"warn",4500);
        break; }
      case "P2P_FORMED": {
        var lp="🤝 "+nm(e.lenderId)+" 放款 "+M(e.amount)+" 給 "+nm(e.borrowerId)+"（年利率 "+util.pct(e.rate,1)+"・"+e.term+" 期・月付 "+M(e.payment)+"）";
        ui.announce(lp, e.borrowerId);
        ui.lastAct[e.lenderId]={turn:ui.S.turnNumber, msg:"💸 放款 "+M(e.amount)+" 給 "+nm(e.borrowerId)+"（"+util.pct(e.rate,1)+"）"};
        ui.lastAct[e.borrowerId]={turn:ui.S.turnNumber, msg:"💸 向 "+nm(e.lenderId)+" 借入 "+M(e.amount)+"（"+util.pct(e.rate,1)+"）"};
        break; }
      case "P2P_REJECTED": {
        var who=nm(e.byId);
        var why = e.byId===e.lenderId
          ? who+" 婉拒放款（現金水位不足，或利率低於其要求 "+util.pct(e.minRate,1)+"）"
          : who+" 不需要民間借貸（銀行額度還沒用完）";
        ui.toast("💸 P2P 未成立："+why,"warn",5000);
        break; }
      case "P2P_PAYMENT": {
        if(e.lenderId===0||e.borrowerId===0){
          var pm="💸 P2P 期款 "+M(e.payment)+"（利息 "+M(e.interest)+"）"+(e.closed?"　✅ 已全數清償":"　餘 "+M(e.remaining));
          if(e.borrowerId===0) ui.lastAct[0]={turn:ui.S.turnNumber, msg:pm+"（付 "+nm(e.lenderId)+"）"};
          else ui.lastAct[0]={turn:ui.S.turnNumber, msg:pm+"（收自 "+nm(e.borrowerId)+"）"};

/* NPC 自動演出 */
ui.tick = function(){
  if(!ui.S || ui.S.over) { if(ui.S && ui.S.over) ui.render(); return; }
  var p=E.activePlayer(ui.S);
  if(!p.isNPC) return;
  clearTimeout(ui._t);
  ui._t = setTimeout(function(){
    if(!ui.S || ui.S.over) return;
    try{
      var pp=E.activePlayer(ui.S); if(!pp.isNPC) return;
      var a=ns.npc.nextAction(ui.S);
      if(!a){ a={type:"END_TURN", playerId:pp.id, payload:null}; }
      if(a.type==="DECIDE" && ui.S.pendingDecision) a.payload.decisionId=ui.S.pendingDecision.decisionId;
      var res=E.apply(ui.S,a);
      if(res.rejected){ res=E.apply(ui.S,{type:"END_TURN",playerId:pp.id,payload:null}); }
      ui.S=res.state; ui.handleEvents(res.events); ui.render(); ui.tick();
    }catch(err){
      if(window&&window.console) console.error("tick error:", err);
      try{ var res2=E.apply(ui.S,{type:"END_TURN",playerId:E.activePlayer(ui.S).id,payload:null});
        if(!res2.rejected){ ui.S=res2.state; ui.handleEvents(res2.events); } }catch(e3){}
      ui.render();
    }
  }, Math.max(60, ui.S.config.npcTurnMs/3));
};

ui.save = function(){
  try{ var S=ui.S;
    localStorage.setItem("finflow.autosave", JSON.stringify({
      schemaVersion:1, seed:S.seed, config:S.config, modules:S.enabledModules,
      players:S.players.map(function(p){ return { name:p.name, isNPC:p.isNPC, personality:p.npcPersonality,
        professionId:p.professionId, dreamCardId:p.dreamCardId }; }),
      actionLog:S.actionLog, turn:S.turnNumber, at:new Date().toISOString() }));
  }catch(err){ /* localStorage 滿載：提示匯出 */ }
};
ns.replay = function(save){
  var S=E.newGame({ seed:save.seed, config:util.clone(save.config), modules:save.modules, players:save.players });
  E.beginTurn(S);
  var log=save.actionLog.slice();
  for(var i=0;i<log.length;i++){
    var r=E.apply(S, {type:log[i].type, playerId:log[i].playerId, payload:log[i].payload}, {mutate:true});
    S=r.state;
  }
  return S;
};
ui.load = function(){
  try{ var raw=localStorage.getItem("finflow.autosave"); if(!raw) return null;
    var save=JSON.parse(raw); if(save.schemaVersion!==1) return null; return save;
  }catch(e){ return null; }
};

ui.showReport = function(){
  if(ui._reported) return; ui._reported=true;
  var S=ui.S;
  var ov=el("div","overlay"), box=el("div","sheetbox");
  box.appendChild(el("h2",null,T("report.title")));
  var win = S.winner===null ? "全員出局" : (S.players[S.winner].name+" 勝出");
  box.appendChild(el("div","sub",win+"　共 "+S.turnNumber+" 輪"));

  // 全體玩家排名表
  var ranked=S.players.slice().sort(function(a,b){
    if(a.bankrupt!==b.bankrupt) return a.bankrupt?1:-1;
    if((a.playerStage==="OUTER")!==(b.playerStage==="OUTER")) return a.playerStage==="OUTER"?-1:1;
    if(a.playerStage==="OUTER"&&b.playerStage==="OUTER") return b.dreamProgress-a.dreamProgress;
    return b.derived.netWorth-a.derived.netWorth; });
  var rt=el("table","tb"); rt.style.marginTop="6px";
  rt.innerHTML="<tr><th>名次</th><th>玩家</th><th>結局</th><th>淨值</th><th>被動收入</th><th>自由輪</th><th>圓夢</th><th>幸福感</th></tr>";
  ranked.forEach(function(x,i){
    var end = x.bankrupt?"破產":(x.playerStage==="OUTER"?"自由圈":"內圈");
    var tr=el("tr"); if(x.id===0) tr.style.background="rgba(242,193,78,.10)";
    tr.innerHTML="<td>"+(i+1)+"</td><td>"+x.name+(x.id===0?"（你）":"")+"</td><td>"+end+"</td>"+
      "<td class='num "+(x.derived.netWorth>=0?"pos":"neg")+"'>"+M(x.derived.netWorth)+"</td>"+
      "<td class='num pos'>"+M(x.derived.passiveIncome)+"</td>"+
      "<td class='num'>"+(x.freeAtTurn?("第"+x.freeAtTurn):"—")+"</td>"+
      "<td class='num'>"+x.dreamProgress+"/"+S.config.dreamCost+"</td>"+
      "<td class='num' style='color:#E8709B'>♥"+ui.wellbeing(x)+"</td>";
    rt.appendChild(tr);
  });
  box.appendChild(rt);

  // 玩家分頁 + 個人明細
  var tabs=el("div","tabs"); tabs.style.marginTop="14px";
  var detail=el("div");
  function renderDetail(p){
    detail.innerHTML="";
    var kv=el("div","kv"); kv.style.gridTemplateColumns="1fr auto 1fr auto";
    function r(k,v,c){ kv.appendChild(el("div","k",k)); kv.appendChild(el("div","v num"+(c?" "+c:""),v)); }
    r(T("report.nw"), M(p.derived.netWorth), p.derived.netWorth>=0?"pos":"neg");
    r(T("report.passive"), M(p.derived.passiveIncome),"pos");
    r(T("report.turns"), p.freeAtTurn?("第 "+p.freeAtTurn+" 輪達成自由"):"未達成");
    r("圓夢進度", p.dreamProgress+" / "+S.config.dreamCost);
    var acc=p.stats.bkRight+p.stats.bkWrong;
    r(T("report.acc"), acc?util.pct(p.stats.bkRight/acc,0):"—");
    r(T("report.skipped"), p.stats.passedOpps+" 次");
    r(T("report.optional"), p.stats.optionalSeen?util.pct(p.stats.optionalBought/p.stats.optionalSeen,0):"—");
    r(T("report.leverage"), p.stats.maxLeverage.toFixed(2)+" 倍");
    if(S.enabledModules.indexOf("M6")>=0){
      r("品格投資累計","−"+M(p.virtueSpendTotal),"neg");
      r(T("report.saved"),"+"+M(p.virtueSavedTotal),"pos"); }
    detail.appendChild(kv);
    if(p.history.length>1){
      var W=820,H=180,pad=28;
      var maxV=Math.max(1, Math.max.apply(null,p.history.map(function(h){return Math.max(h.nw,h.passive*10,h.expense*10);})));
      var line=function(key,mult){ return p.history.map(function(h,i){
        var x=pad+i*(W-2*pad)/(p.history.length-1);
        var y=H-pad-(h[key]*mult/maxV)*(H-2*pad);
        return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" "); };
      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:180px;margin-top:14px">'+
        '<rect width="'+W+'" height="'+H+'" fill="#0E1520" rx="10"/>'+
        '<path d="'+line("nw",1)+'" fill="none" stroke="#F2C14E" stroke-width="2"/>'+
        '<path d="'+line("passive",10)+'" fill="none" stroke="#35C4A8" stroke-width="2"/>'+
        '<path d="'+line("expense",10)+'" fill="none" stroke="#F0803C" stroke-width="2" stroke-dasharray="4 3"/>'+
        '<text x="'+pad+'" y="16" fill="#6B7F98" font-size="11">淨值（金）／被動收入（綠，×10）／總支出（橘虛線，×10）</text></svg>';
      var w=el("div"); w.innerHTML=svg; detail.appendChild(w);
    }
    var keys=p.ledger.filter(function(e){ return e.eduTags.some(function(t){
      return ["passive-income","leverage","exit","startup","business"].indexOf(t)>=0; }); }).slice(-14);
    if(keys.length){
      var tb=el("table","tb"); tb.style.marginTop="14px";
      tb.innerHTML="<tr><th>回合</th><th>決策</th><th>現金影響</th></tr>";
      keys.forEach(function(e){
        var cash=util.sum(e.postings.filter(function(q){return q.account==="CASH";}),function(q){return q.delta;});
        var tr=el("tr");
        tr.innerHTML="<td>"+e.turnNumber+"</td><td>"+e.summary+"</td><td class='num "+(cash>=0?"pos":"neg")+"'>"+(cash>=0?"+":"")+M(cash)+"</td>";
        tb.appendChild(tr); });
      detail.appendChild(tb);
    } else { detail.appendChild(el("div","flavor","這位玩家沒有明顯的投資決策紀錄。")); }
  }
  S.players.forEach(function(pl){
    var b=el("button","tab"+(pl.id===0?" on":""), pl.name+(pl.id===0?"（你）":""));
    b.onclick=function(){ tabs.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");}); b.classList.add("on"); renderDetail(pl); };
    tabs.appendChild(b);
  });
  box.appendChild(tabs); box.appendChild(detail);
  renderDetail(S.players[0]);

  var opts=el("div","opts");
  var ex=el("button","opt",T("report.export"));
  ex.onclick=function(){ ui.exportJSON({ seed:S.seed, config:S.config, modules:S.enabledModules,
    actionLog:S.actionLog, result:{winner:S.winner, turns:S.turnNumber,
    players:S.players.map(function(x){ return {name:x.name, profession:x.professionId, nw:x.derived.netWorth,
      passive:x.derived.passiveIncome, free:x.freeAtTurn, dream:x.dreamProgress, bankrupt:x.bankrupt}; })}},
    "finflow-replay.json"); };
  var again=el("button","opt","再玩一局");
  again.onclick=function(){ ov.remove(); ui._reported=false; ui.S=null; $("app").classList.add("hide"); ui.showSetup(); };
  opts.appendChild(again); opts.appendChild(ex); box.appendChild(opts);
  ov.appendChild(box); $("overlays").appendChild(ov);
};
