<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FinFlow 財商沙盒</title>
<style>
/* ============================================================
   FinFlow — 版面基準 iPad 橫向 1180x820（相容 1024x768 ~ 1366x1024）
   色彩：深墨帳簿底 + 金色自由水位線；增=藍綠 減=橘紅（色盲友善）
   ============================================================ */
:root{
  --ink:#0E1520; --ink2:#131D2B; --panel:#16202E; --panel2:#1B2839;
  --line:#24344A; --line2:#2E4462;
  --tx:#E8EEF5; --tx2:#9DB0C7; --tx3:#6B7F98;
  --pos:#35C4A8; --neg:#F0803C; --gold:#F2C14E; --gold-d:#8A6B1F;
  --opp:#3E7DD6; --life:#B45FD0; --mkt:#2E9E86; --evt:#D68C3E; --pay:#F2C14E; --lay:#C2493D;
  --r:10px; --r2:16px;
  --zoom:1;            /* 與下方 body{zoom} 同步：覆蓋層用它把 vh/vw 換算回實際視窗 */
  --fs-body:15.5px; --fs-sm:14px; --fs-xs:13px;
  --sans:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 螢幕適配：以 iPad 橫向（~1180px）為基準，NB／PC 逐級放大 */
@media (min-width:1440px){ body{zoom:1.12} :root{--zoom:1.12} }
@media (min-width:1720px){ body{zoom:1.28} :root{--zoom:1.28} }
@media (min-width:2100px){ body{zoom:1.5}  :root{--zoom:1.5}  }
@media (max-width:1080px){ body{zoom:0.9}  :root{--zoom:0.9}  }
/* zoom 會連 vh/vw 一起放大——所有 fixed 覆蓋層都要除回來，否則在 PC（≥1440px）上
   視窗高度會被撐成 112~150%，上緣被切、下緣（開局鈕）也捲不到。 */
:root{ --vh:calc(1vh / var(--zoom)); --vw:calc(1vw / var(--zoom)); }
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--tx);
  font-family:var(--sans);font-size:var(--fs-body);-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pos{color:var(--pos)} .neg{color:var(--neg)} .gold{color:var(--gold)}
.hide{display:none !important}

/* ---------- 轉向遮罩 ---------- */
#rotate{position:fixed;inset:0;height:calc(var(--vh)*100);width:calc(var(--vw)*100);z-index:900;background:var(--ink);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:40px}
#rotate .ic{font-size:56px}
@media (orientation:portrait) and (max-width:1100px){ #rotate{display:flex} }

/* ---------- 主框架 ---------- */
#app{display:grid;grid-template-rows:1fr;height:100%;width:100%}

/* 操作區圖示鈕（原頂欄，八期併入）與停用樣式 */
#opsIcons{display:flex;gap:8px;justify-content:flex-end;margin-top:7px}
.act[disabled],.act:disabled{opacity:.34;cursor:not-allowed;filter:grayscale(1)}
.mini[disabled],.mini:disabled{opacity:.34;cursor:not-allowed;filter:grayscale(1)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line2);font-size:var(--fs-sm);white-space:nowrap}
.badge b{font-weight:700}
.macro-RECOVERY{border-color:#2F6E5B;color:#7FE3C7} .macro-BOOM{border-color:#8A6B1F;color:var(--gold)}
.macro-RECESSION{border-color:#8A4B2A;color:#F5A96E} .macro-DEPRESSION{border-color:#7A2F2A;color:#F08A80}
.iconbtn{width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center;font-size:18px;
  background:var(--panel2);border:1px solid var(--line2)}
.iconbtn:active{background:var(--line2)}

/* 主區：方案丙三欄（左：地圖＋玩家動作｜中：資訊與操作｜右：玩家狀態紀錄區） */
#main{display:grid;grid-template-columns:37% 23% 40%;min-height:0;min-width:0}
#leftCol{display:flex;flex-direction:column;min-width:0;min-height:0}
#boardWrap{position:relative;min-width:0;min-height:0;flex:1 1 auto;display:grid;place-items:center;padding:4px;overflow:hidden}
#boardSvg{width:100%;height:100%;max-height:100%;display:block}
.sp-label{font-size:13.5px;fill:var(--tx2);pointer-events:none;font-family:var(--sans);font-weight:600}
/* 盤面中央：擲骰／回合按鈕（不再是 modal） */
#boardCenter{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;max-width:52%}
#boardCenter > *{pointer-events:auto}
#boardCenter .bigbtn{padding:11px 20px;font-size:15px;min-height:44px;min-width:130px}
#boardCenter .npcThink{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:8px 12px;font-size:var(--fs-xs);color:var(--tx2);text-align:center;max-width:100%}
#boardCenter .npcThink b{display:block;color:var(--tx);font-size:var(--fs-sm);margin-bottom:2px}

/* 中欄：總經／股市／系統訊息／交易所／操作區 */
#finBoard{background:var(--ink2);border-left:1px solid var(--line);border-right:1px solid var(--line);
  min-height:0;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.lamp{display:inline-block;width:11px;height:11px;border-radius:99px;vertical-align:middle;margin-right:4px}
#sysLog{font-size:13px;line-height:1.5;color:var(--tx2)}
#sysLog .ln{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
#sysLog .ln.new{color:var(--gold);font-weight:600}
#sysLog .tn{color:var(--tx3);margin-right:4px;font-variant-numeric:tabular-nums;font-weight:400}
#opsGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#opsGrid .act{padding:9px 4px;font-size:13.5px;text-align:center}
#opsGrid .act.primary{background:linear-gradient(135deg,rgba(242,193,78,.22),rgba(242,193,78,.10));border-color:var(--gold-d)}
.fbSec{padding:8px 12px;border-bottom:1px solid var(--line)}
.fbSec:last-child{border-bottom:0}
.fbSec h4{margin:0 0 6px;font-size:var(--fs-xs);letter-spacing:.16em;color:var(--tx3);font-weight:700}
.fbGrid{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:var(--fs-sm)}
.fbGrid .k{color:var(--tx2)} .fbGrid .v{text-align:right;font-weight:600}
.fbRow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);
  font-size:var(--fs-sm);cursor:pointer}
.fbRow:first-of-type{border-top:0}
.fbRow:active{background:var(--panel)}
.fbRow .nm{flex:1;min-width:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-xs)}
.fbRow .px{font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:var(--fs-xs)}
.fbRow .ch{font-variant-numeric:tabular-nums;min-width:42px;text-align:right;font-size:12.5px}
.fbRow .yl{font-variant-numeric:tabular-nums;min-width:40px;text-align:right;font-size:12.5px;color:var(--tx3)}
.spark{width:40px;height:22px;flex:none}
.fbWarn{color:var(--neg)}

/* 左欄底部：玩家動作列（每人一欄：狀態／動作） */
#dynamics{background:var(--ink2);border-top:1px solid var(--line);flex:0 0 auto;min-width:0}
#pawns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;min-height:126px}
.pcol{border-right:1px solid var(--line);padding:8px 9px;min-width:0;text-align:left;background:none}
.pcol:last-child{border-right:0}
.pcol.active{background:rgba(242,193,78,.07);box-shadow:inset 0 2px 0 var(--gold)}
.pcol.out{opacity:.42}
.pcol .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.pcol .st{font-size:13.5px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol .ac{font-size:13.5px;color:var(--gold);margin-top:2px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
.sp-cell{transition:filter .18s}
.sp-cell.here{filter:brightness(1.55)}
.pawn{transition:transform .18s cubic-bezier(.34,1.3,.64,1)}
.pawn-ring{fill:none;stroke-width:2.5}

/* 開局畫面：頁尾（種子＋開局鈕）常駐底部，內容再長也一定按得到 */
.setupFoot{position:sticky;bottom:-20px;margin:14px -22px -20px;padding:14px 22px 16px;
  background:linear-gradient(180deg,rgba(22,32,46,0),var(--panel) 14%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center;z-index:2}

/* V11.1：理賠明細 */
.claimBox{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;margin:9px 0}
.claimBox .ttl{font-weight:700;font-size:14.5px;margin-bottom:6px}
.claimTb{width:100%;border-collapse:collapse;font-size:13.5px}
.claimTb td{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.claimTb td.num{text-align:right;font-variant-numeric:tabular-nums}
.claimTb tr.tot td{border-top:1px solid var(--line2);border-bottom:0;padding-top:5px}
.claimBox .note{margin-top:7px;font-size:13px;line-height:1.55;color:var(--tx2)}

/* V11.1：幸福感明細 */
.wbTb{width:100%;border-collapse:collapse;font-size:13.5px}
.wbTb th{text-align:left;color:var(--tx3);font-size:var(--fs-xs);font-weight:700;padding:3px 2px;border-bottom:1px solid var(--line)}
.wbTb td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.wbTb td.num{text-align:right;font-variant-numeric:tabular-nums}
.wbTb tr.tot td{border-top:1px solid var(--line2);border-bottom:0;font-weight:700;padding-top:6px}
.wbClick{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.28);text-underline-offset:3px}

/* V10：人生商城 */
.mallGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:6px 0 2px}
.mallItem{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;text-align:left}
.mallItem:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed}
.mallItem .ic{font-size:19px;line-height:1}
.mallItem .tt{font-weight:700;font-size:14.5px;margin:3px 0 1px}
.mallItem .fl{color:var(--tx3);font-size:12.5px;line-height:1.45}
.mallItem .pr{color:var(--gold);font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.mallGroup{color:var(--tx3);font-size:var(--fs-xs);letter-spacing:.14em;margin:12px 0 2px;font-weight:700}
.mallOn{border-color:var(--pos);box-shadow:inset 0 0 0 1px rgba(53,196,168,.35)}

/* 決策 modal：置中 fixed，內容再長也可捲（方案乙定案） */
#center{position:fixed;inset:0;height:calc(var(--vh)*100);width:calc(var(--vw)*100);
  z-index:600;display:none;align-items:center;justify-content:center;
  padding:calc(var(--vh)*3) 16px;background:rgba(6,10,16,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#center.on{display:flex}
#center > *{width:min(calc(var(--vw)*94),460px);max-height:calc(var(--vh)*86);overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin}
#center > .wide{width:min(calc(var(--vw)*94),780px)}
.pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.bigbtn{padding:16px 30px;border-radius:var(--r2);background:linear-gradient(180deg,var(--gold),#D9A72F);
  color:#1A1206;font-weight:800;font-size:19px;letter-spacing:.06em;box-shadow:0 6px 20px rgba(242,193,78,.22);
  min-height:56px;min-width:170px}
.bigbtn:active{transform:translateY(1px)}
.bigbtn[disabled]{background:var(--panel2);color:var(--tx3);box-shadow:none}
#dice{width:78px;height:78px;border-radius:18px;background:var(--panel2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:38px;font-weight:800}
#dice.rolling{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-13deg) scale(1.08)}75%{transform:rotate(13deg) scale(1.08)}}

/* 卡牌 / 決策面板 */
.card{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);
  padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.5);max-height:86vh;overflow:auto;
  animation:pop .2s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.card h3{margin:0 0 3px;font-size:18px;letter-spacing:.02em}
.card .flavor{color:var(--tx2);font-size:var(--fs-sm);margin-bottom:10px;line-height:1.5}
.card .edu{background:rgba(242,193,78,.09);border-left:3px solid var(--gold-d);padding:8px 10px;
  border-radius:0 8px 8px 0;font-size:var(--fs-sm);color:#E6D6A8;margin:9px 0;line-height:1.55}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:var(--fs-sm);margin:8px 0}
.kv .k{color:var(--tx2)} .kv .v{text-align:right}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{padding:12px 14px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);
  text-align:left;min-height:46px;line-height:1.4}
.opt:active{background:var(--line2)}
.opt.rec{border-color:var(--gold-d);box-shadow:inset 0 0 0 1px rgba(242,193,78,.2)}
.opt.rec::after{content:"建議";float:right;font-size:var(--fs-xs);color:var(--gold);margin-left:8px}
.opt small{display:block;color:var(--tx2);font-size:var(--fs-xs);margin-top:3px}
.opt[disabled]{opacity:.4}
.slider{margin:10px 0 4px}
.slider input{width:100%;accent-color:var(--gold)}
.preview{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;
  font-size:var(--fs-sm);margin-top:8px}

/* 右欄財報 */
#sheet{background:var(--ink2);display:flex;flex-direction:column;min-height:0;min-width:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}
/* 狀態區細項表 */
.dtb{width:100%;border-collapse:collapse;font-size:13px}
.dtb th{color:var(--tx3);font-weight:700;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line);
  letter-spacing:.05em;white-space:nowrap}
.dtb td{padding:2.5px 4px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtb .num{text-align:right}
.mini{padding:4px 7px;font-size:13px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);min-height:26px}
.mini[disabled]{opacity:.35}
.mini.gold{border-color:var(--gold-d);color:var(--gold)}
.qty{width:40px;background:var(--ink);border:1px solid var(--line2);border-radius:6px;color:var(--tx);
  padding:3px 3px;font-family:var(--mono);font-size:13px;text-align:center}
.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twoCol > *{min-width:0;overflow:hidden}
.twoCol .dtb{table-layout:fixed}
.twoCol .dtb td:first-child,.twoCol .dtb th:first-child{width:34%}
.twoCol .dtb td:last-child,.twoCol .dtb th:last-child{width:34px}
#sheet .sec{padding:10px 13px;border-bottom:1px solid var(--line)}
#sheet h4{margin:0 0 7px;font-size:var(--fs-xs);letter-spacing:.16em;color:var(--tx3);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:var(--fs-sm)}
.row.total{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-weight:700;font-size:var(--fs-body)}
.row .lbl{color:var(--tx2)} .row .val{font-weight:600}
.flash{animation:flash 1.5s ease-out}
@keyframes flash{0%{background:rgba(242,193,78,.28)}100%{background:transparent}}
#holdings{min-height:0}
.hold{display:flex;justify-content:space-between;gap:8px;padding:7px 13px;border-bottom:1px solid var(--line);
  font-size:var(--fs-sm);cursor:pointer}
.hold:active{background:var(--panel)}
.hold .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hold .sub{color:var(--tx3);font-size:var(--fs-xs)}
.freedom{padding:11px 13px;background:var(--panel);border-top:1px solid var(--line2)}
.bar{height:12px;border-radius:99px;background:var(--ink);overflow:hidden;border:1px solid var(--line2);margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));
  transition:width .5s cubic-bezier(.2,.8,.3,1)}
.freedom .cap{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--tx2);margin-top:5px}

/* 玩家動態橫卡（原底欄 pchip 改為整列） */
/* M7 信用評級章 */
.crb{display:inline-block;min-width:17px;text-align:center;font-size:13px;font-weight:700;line-height:1.5;
  padding:0 5px;border-radius:4px;border:1px solid;letter-spacing:.04em;vertical-align:middle}
.crb.A{color:var(--gold);border-color:var(--gold-d);background:rgba(242,193,78,.10)}
.crb.B{color:var(--tx3);border-color:#4A4F59;background:rgba(255,255,255,.04)}
.crb.C{color:var(--neg);border-color:#7A3E1E;background:rgba(240,128,60,.10)}
.pchip{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--r);background:var(--panel);
  border:1px solid var(--line);width:100%;font-size:var(--fs-xs);text-align:left;flex:none}
.pchip > div{flex:1;min-width:0}
.pbar{height:6px;border-radius:99px;background:var(--ink);overflow:hidden;border:1px solid var(--line2);margin:3px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.pchip.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(242,193,78,.3)}
.pchip.out{opacity:.42}
.laLine{font-size:13px;color:var(--gold);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.laLine.dim{color:var(--tx3)}
.pchip .dot{width:11px;height:11px;border-radius:99px;flex:none}
.pchip .nm{font-size:var(--fs-sm);font-weight:600}
.act{padding:11px 15px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);
  font-size:var(--fs-sm);min-height:44px;white-space:nowrap}
.act:active{background:var(--line2)}
.act.primary{background:linear-gradient(180deg,var(--gold),#D9A72F);color:#1A1206;font-weight:800;border-color:transparent}
.act[disabled]{opacity:.35}

/* ---------- 記帳：拖曳分類 ---------- */
#bkTray{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;gap:9px;flex-wrap:wrap;
  justify-content:center;pointer-events:auto}
.pcard{padding:9px 12px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);
  font-size:var(--fs-sm);touch-action:none;user-select:none;box-shadow:0 5px 16px rgba(0,0,0,.45)}
.pcard.drag{position:fixed;z-index:800;pointer-events:none;transform:scale(1.05);border-color:var(--gold)}
.pcard.sel{border-color:var(--gold);background:rgba(242,193,78,.14);box-shadow:0 0 0 2px rgba(242,193,78,.35)}
.pcard.bad{animation:bad .4s}
@keyframes bad{0%,100%{transform:none}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.dropzone{outline:2px dashed var(--gold);outline-offset:-4px;background:rgba(242,193,78,.07)}

/* ---------- 覆蓋層（開局 / 復盤 / 調參 / 自測） ---------- */
/* 九期：全服公告（重大事件橫幅） */
#bcast{position:fixed;left:0;right:0;top:0;width:calc(var(--vw)*100);z-index:820;display:flex;justify-content:center;
  pointer-events:none;padding:10px 12px}
#bcast .bc{pointer-events:auto;background:linear-gradient(135deg,rgba(242,193,78,.97),rgba(240,160,60,.97));
  color:#221803;border-radius:14px;padding:11px 20px;max-width:min(760px,calc(var(--vw)*94));
  box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);
  animation:bcIn .38s cubic-bezier(.2,1.2,.3,1);text-align:center}
#bcast .bc .ttl{font-size:17px;font-weight:800;letter-spacing:.04em}
#bcast .bc .sub{font-size:14px;margin-top:2px;opacity:.85}
#bcast .bc.warn{background:linear-gradient(135deg,rgba(226,84,74,.97),rgba(190,58,50,.97));color:#fff}
#bcast .bc.warn .sub{opacity:.92}
@keyframes bcIn{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.overlay{position:fixed;inset:0;height:calc(var(--vh)*100);width:calc(var(--vw)*100);z-index:700;background:rgba(6,10,16,.82);display:flex;
  align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(3px)}
.sheetbox{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:20px 22px;
  width:min(920px,calc(var(--vw)*94));max-height:calc(var(--vh)*92);overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheetbox h2{margin:0 0 4px;font-size:23px;letter-spacing:.03em}
.sheetbox .sub{color:var(--tx2);font-size:var(--fs-sm);margin-bottom:16px}
.grid{display:grid;gap:9px}
.pick{padding:11px 13px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);text-align:left}
.pick.on{border-color:var(--gold);background:rgba(242,193,78,.11)}
.pick .t{font-weight:700;font-size:var(--fs-body)}
.pick .d{color:var(--tx2);font-size:var(--fs-xs);margin-top:3px;line-height:1.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}
.tab{padding:7px 13px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);font-size:var(--fs-sm)}
.tab.on{background:var(--gold);color:#1A1206;font-weight:700;border-color:transparent}
table.tb{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.tb th,table.tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb th{color:var(--tx3);font-size:var(--fs-xs);letter-spacing:.1em;font-weight:700}

/* 調參面板 */
#devpanel{position:fixed;top:0;right:0;bottom:0;height:calc(var(--vh)*100);width:min(400px,calc(var(--vw)*92));z-index:750;background:var(--ink2);
  border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column}
#devpanel.on{transform:none}
#devpanel .hd{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#devbody{flex:1;overflow-y:auto;padding:6px 0 40px}
.cfgroup>summary{padding:9px 15px;font-weight:700;font-size:var(--fs-sm);cursor:pointer;background:var(--panel);
  border-bottom:1px solid var(--line);list-style:none}
.cfgroup>summary::-webkit-details-marker{display:none}
.cfgroup>summary::before{content:"▸ ";color:var(--tx3)}
.cfgroup[open]>summary::before{content:"▾ "}
.cfrow{padding:8px 15px;border-bottom:1px solid var(--line)}
.cfrow .l{display:flex;justify-content:space-between;font-size:var(--fs-sm);gap:8px}
.cfrow .d{color:var(--tx3);font-size:var(--fs-xs);margin-top:2px}
.cfrow input[type=range]{width:100%;accent-color:var(--gold);margin-top:5px}
.cfrow input[type=number]{width:82px;background:var(--ink);border:1px solid var(--line2);border-radius:6px;
  color:var(--tx);padding:3px 6px;font-family:var(--mono);font-size:var(--fs-sm)}
.hotdot{width:6px;height:6px;border-radius:99px;background:var(--pos);display:inline-block;margin-left:5px}

/* 記錄 / 提示 */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:820;display:flex;
  flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-radius:99px;padding:9px 17px;
  font-size:var(--fs-sm);box-shadow:0 8px 26px rgba(0,0,0,.5);animation:tin .3s}
.toast.warn{border-color:#8A4B2A;color:#F5A96E} .toast.good{border-color:#2F6E5B;color:#7FE3C7}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.log{font-family:var(--mono);font-size:var(--fs-xs);color:var(--tx2);white-space:pre-wrap;line-height:1.6}
.ok{color:var(--pos)} .fail{color:var(--neg)}
svg text{user-select:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<script>
/* ============================================================================
   FinFlow 財商沙盒 — 引擎層（純函數，零 DOM 依賴）
   鐵律一：引擎不讀寫 DOM、不使用 Date.now() / 未播種的 Math.random()
   鐵律二：所有數值來自內容包與 CONFIG
   鐵律三：每一筆金錢變動都產生 LedgerEntry
   ============================================================================ */
var ns = (function(){
"use strict";
var ns = {};

/* ------------------------------ ns.util ---------------------------------- */
var util = ns.util = {
  clone: function(o){ return typeof structuredClone==="function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)); },
  r2: function(n){ return Math.round(n*100)/100; },
  // mulberry32：32-bit seeded PRNG。所有遊戲隨機都經由 state.rngState 推進
  rand: function(S){ var t = S.rngState += 0x6D2B79F5; t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14) >>> 0) / 4294967296; },
  // NPC 專用亂數串流：不污染引擎 rngState，確保 actionLog 重放一致（T-01）
  randAux: function(S){ var t = S.auxRngState = (S.auxRngState + 0x9E3779B9)>>>0;
    t = Math.imul(t ^ t>>>16, 0x21F0AAAD); t = Math.imul(t ^ t>>>15, 0x735A2D97);
    return ((t ^ t>>>15) >>> 0) / 4294967296; },
  randInt: function(S,a,b){ return a + Math.floor(util.rand(S)*(b-a+1)); },
  gauss: function(S){ var u=1-util.rand(S), v=util.rand(S);
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
  shuffle: function(S,arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){
    var j=Math.floor(util.rand(S)*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; },
  pick: function(S,arr){ return arr[Math.floor(util.rand(S)*arr.length)]; },
  money: function(n){ var v=Math.round(n*1000); var s=Math.abs(v).toLocaleString("en-US");
    return (v<0?"−":"")+s; },
  pct: function(n,d){ return (n*100).toFixed(d===undefined?1:d)+"%"; },
  sum: function(a,f){ var s=0; for(var i=0;i<a.length;i++) s+=f(a[i],i); return s; },
  uid: function(S,p){ S.uidSeq=(S.uidSeq||0)+1; return p+"_"+S.uidSeq; }
};

/* ----------------------------- ns.ledger --------------------------------- */
/* 財報唯一真值來源：所有數字都由 postings 推導。
   存量科目：CASH / ASSET / LIABILITY（累加 = 當前餘額）
   流量科目：INCOME_ACTIVE / INCOME_PASSIVE / EXPENSE（累加 = 當前每月流量） */
var ledger = ns.ledger = {
  ACCOUNTS: ["CASH","ASSET","LIABILITY","INCOME_ACTIVE","INCOME_PASSIVE","EXPENSE"],
  QUADRANT: { ASSET:"asset", LIABILITY:"liab", INCOME_ACTIVE:"income", INCOME_PASSIVE:"income", EXPENSE:"expense" },

  post: function(S, p, summary, postings, opts){
    opts = opts||{};
    var entry = { entryId: util.uid(S,"e"), turnNumber: S.turnNumber, playerId: p.id,
      sourceAction: S.actionLog.length, summary: summary,
      postings: postings.filter(function(x){ return x.delta !== 0; }).map(function(x){
        return { account:x.account, delta:util.r2(x.delta), refId:x.refId||null, label:x.label }; }),
      eduTags: opts.eduTags||[], detail: opts.detail||null, kind: opts.kind||"TX" };
    if(!entry.postings.length && !entry.detail) return null;
    entry = ns.modules.beforeLedgerPost(S, p, entry);
    if(!entry) return null;
    p.ledger.push(entry);
    ledger.recompute(p);
    return entry;
  },

  recompute: function(p){
    var d = { salaryIncome:0, passiveIncome:0, totalExpenses:0, netCashflow:0,
              totalAssets:0, totalLiabilities:0, netWorth:0 }, cash=0;
    for(var i=0;i<p.ledger.length;i++){ var ps=p.ledger[i].postings;
      for(var j=0;j<ps.length;j++){ var q=ps[j];
        switch(q.account){
          case "CASH": cash+=q.delta; break;
          case "ASSET": d.totalAssets+=q.delta; break;
          case "LIABILITY": d.totalLiabilities+=q.delta; break;
          case "INCOME_ACTIVE": d.salaryIncome+=q.delta; break;
          case "INCOME_PASSIVE": d.passiveIncome+=q.delta; break;
          case "EXPENSE": d.totalExpenses+=q.delta; break;
        } } }
    d.salaryIncome=util.r2(d.salaryIncome); d.passiveIncome=util.r2(d.passiveIncome);
    d.totalExpenses=util.r2(d.totalExpenses); d.totalAssets=util.r2(d.totalAssets);
    d.totalLiabilities=util.r2(d.totalLiabilities);
    d.netCashflow=util.r2(d.salaryIncome+d.passiveIncome-d.totalExpenses);
    d.netWorth=util.r2(cash+d.totalAssets-d.totalLiabilities);
    p.cash=util.r2(cash); p.derived=d;
    if(p.cash<0 && p.creditFlags) p.creditFlags.cashWentNegative=true;   // M7：本檢視期內曾現金為負
    return d;
  },

  freedomRatio: function(p){ var d=p.derived;
    return d.totalExpenses<=0 ? 1 : Math.max(0, d.passiveIncome/d.totalExpenses); }
};

E.cfg = function(S, key){
  var best=null;
  for(var i=0;i<S.activeGlobalEvents.length;i++){ var ev=S.activeGlobalEvents[i];
    if(ev.param===key){ if(!best || ev.priority>best.priority || (ev.priority===best.priority && ev.seq>best.seq)) best=ev; } }
  return best ? best.value : S.config[key];
};
E.effMaxLTV = function(S){
  var liq = S.enabledModules.indexOf("M4")>=0 ? S.macro.liquidity : 1;
  var ceil = E.cfg(S,"maxLTVCeiling"); if(ceil===undefined) ceil=0.85;
  return Math.max(0.3, Math.min(ceil, E.cfg(S,"maxLTV") * liq));
};
// 本利攤還月付額（等額本息）
E.pmt = function(P, annualRate, months){
  P=P||0; if(months<=0) return util.r2(P);
  var r=annualRate/12;
  if(r<1e-9) return util.r2(P/months);
  return util.r2(P * r / (1 - Math.pow(1+r, -months)));
};
// 各類貸款年限（月）：融資只付息(0)，房貸 20 年，學貸 2 年，其餘信貸 7 年
E.loanTerm = function(S, kind, isStudent){
  if(kind==="MARGIN") return 0;
  if(isStudent){ var st=E.cfg(S,"studentTermMonths"); return st===undefined?24:st; }
  if(kind==="MORTGAGE"){ var mt=E.cfg(S,"mortgageTermMonths"); return mt===undefined?240:mt; }
  var ct=E.cfg(S,"creditTermMonths"); return ct===undefined?84:ct;
};
E.isStudentLoan = function(name){ return /學貸/.test(name||"") && !/留學/.test(name||""); };
// 重算某貸款的月付（餘額/利率/年限變動時）；回傳 EXPENSE 變動量
E.repriceLoan = function(l){
  if(l.studentLoan && !l.amortStarted){ return 0; } // 學貸寬限期不重算
  var newPay = l.termMonths>0 ? E.pmt(l.principal, l.annualRate, l.termMonths) : util.r2(l.principal*l.annualRate/12);
  var d = util.r2(newPay - l.monthlyPayment);
  l.monthlyPayment = newPay;
  return d;
};
// 信用額度：無擔保負債不得超過月收入的 dbrMultiple 倍（台灣 DBR 22 倍規範）
E.creditCapacity = function(S, p){
  var unsecured = 0;
  p.liabilities.forEach(function(l){ if(l.kind==="CONSUMER"||l.kind==="CREDIT") unsecured += l.principal; });
  var dbr = E.cfg(S,"dbr_"+(p.creditRating||"B"));
  if(dbr===undefined) dbr = E.cfg(S,"dbrMultiple");
  if(dbr===undefined) dbr=22;
  var cap = p.derived.salaryIncome * dbr - unsecured;
  return util.r2(Math.max(0, cap));
};

/* --- 建局 --- */
E.newGame = function(opts){
  var C = ns.content, S = {
    schemaVersion:1, engineVersion:E.VERSION, seed:opts.seed>>>0, rngState:opts.seed>>>0,
    auxRngState:(opts.seed^0x5F3759DF)>>>0,
    config: opts.config, enabledModules: opts.modules.slice(),
    turnNumber:1, phase:"ROLL", activePlayerIdx:0, players:[], macro:null,
    decks:{}, activeGlobalEvents:[], eventSeq:0, actionLog:[], decisionQueue:[],
    pendingDecision:null, winner:null, uidSeq:0, log:[], bookkeeping:null, pendingTrade:null, pendingShock:null,
    stockPrices:{}, dividendBonus:{}, spaceMult:{}, tapestrySample:[], over:false
  };
  S.macro = { stage:"RECOVERY", baseRate:S.config.rate_RECOVERY, targetRate:S.config.rate_RECOVERY,
              inflation:S.config.infl_RECOVERY, sinceReview:0,
              liquidity:S.config.liq_RECOVERY, turnsInStage:0 };
  C.stockDefs.forEach(function(s){ S.stockPrices[s.symbol]=s.face; });
  S.stockHistory={}; C.stockDefs.forEach(function(s){ S.stockHistory[s.symbol]=[s.face]; });
  // 每局隨機化股票顯示名（保留類型後綴），破除玩家記名規律；用種子決定、可重放
  var NAMEPOOL={
    STK_TECH:["晶宇","翔昱","宏鏵","凌通創","鈺群","博晟","泰擎","昇陽微"],
    STK_DIV:["台興","中鼎民生","華欣","國樺","富穩","力鴻","誠信","日盛豐"],
    STK_ETF:["寶島大盤","台灣精選","福爾摩沙","全市場","高股息旗艦","中型100"],
    STK_SPEC:["星火","飆雲","逐日","躍馬","狂潮","閃燄","黑天鵝"]
  };
  var SUFFIX={STK_TECH:"科技（成長股）",STK_DIV:"電信（高股息）",STK_ETF:" ETF",STK_SPEC:"小型股（投機）"};
  S.stockNames={};
  C.stockDefs.forEach(function(s, i){
    var pool=NAMEPOOL[s.symbol]||[s.name.replace(/（.*）| ETF/,"")];
    var h=(S.seed>>>0);
    for(var k=0;k<s.symbol.length;k++) h=(h*31 + s.symbol.charCodeAt(k))>>>0;
    h=(h ^ (h>>>13))>>>0; h=(h*1274126177)>>>0; h=(h ^ (h>>>16))>>>0;
    var base=pool[h % pool.length];
    S.stockNames[s.symbol]=base+(SUFFIX[s.symbol]||"");
  });

  opts.players.forEach(function(pd,idx){ S.players.push(E.makePlayer(S, idx, pd)); });
  E.buildDecks(S);
  ns.modules.onGameSetup(S);
  return S;
};

E.makePlayer = function(S, idx, pd){
  var prof = ns.content.professionById[pd.professionId];
  var p = { id:idx, name:pd.name, isNPC:!!pd.isNPC, npcPersonality:pd.personality||null,
    professionId:prof.id, retiredProfessionId:null, position:0, cash:0, ledger:[],
    assets:[], liabilities:[], derived:{}, childrenCount:0, bankrupt:false,
    financiallyFree:false, freeAtTurn:null, skippedTurns:0,
    creditRating:"B", creditFlags:{usedRescue:false, everBankrupt:false, cashWentNegative:false},
    blessingHWM:0, flags:{},
    baseSalary:0, salaryVolatility:prof.salaryVolatility||0,
    playerStage:"INNER", dreamCardId:pd.dreamCardId||null, dreamProgress:0, outerPos:0,
    graduatedAtTurn:null, freefallWarnings:0, dreamBuyCount:0, boughtProgressThisTurn:false, atDreamSite:false,
    virtues:{TEMPER:0,PRUDENCE:0,PARENTING:0,FILIAL:0}, virtueSpendTotal:0, virtueSavedTotal:0,
    professionEventDone:{}, stats:{ bkRight:0, bkWrong:0, passedOpps:0, optionalSeen:0,
      optionalBought:0, maxLeverage:0, auditPass:0, auditFail:0, paydays:0, freeProgress:0, paidProgress:0,
      mallJoy:0, mallCount:0, referrals:0, referralFees:0 },
    mallBought:{}, mallBoughtThisTurn:0,
    history:[] };

  var cm = S.config.startingCashMult, sm = S.config.salaryMult, em = S.config.expenseMult;
  var salary = util.r2(prof.salary*sm), expenses = util.r2(prof.baseExpenses*em);
  p.baseSalary = salary;
  var post = [ {account:"CASH", delta:util.r2(prof.startingCash*cm), label:"起始現金"},
               {account:"INCOME_ACTIVE", delta:salary, label:"薪資"},
               {account:"EXPENSE", delta:expenses, label:"生活支出"} ];
  (prof.startingLiabilities||[]).forEach(function(l){
    var id = util.uid(S,"L");
    var rate = l.isFloating ? (S.macro.baseRate + (l.rateSpread||S.config.mortgageSpread)) : l.annualRate;
    var isStu = E.isStudentLoan(l.name);
    var term = E.loanTerm(S, l.kind, isStu);
    var pay = term>0 ? E.pmt(l.principal, rate, term) : util.r2(l.principal*rate/12);
    // 九期：開局負債也走浮動（含就學貸款＝機動利率），並記錄原始金額／起始輪／已還期數
    var floatDef = (S.config.floatingByDefault===undefined) ? 1 : S.config.floatingByDefault;
    var lo = { instanceId:id, kind:l.kind, name:l.name, principal:l.principal,
      annualRate:rate, isFloating: floatDef ? true : !!l.isFloating,
      rateSpread: (l.rateSpread!==undefined ? l.rateSpread : S.config.mortgageSpread),
      termMonths:term, monthlyPayment:pay, collateralAssetId:null, flags:{},
      originalPrincipal:l.principal, startTurn:0, periodsPaid:0 };
    if(isStu){ lo.studentLoan=true; lo.graceUntilTurn=(S.config.studentGraceTurns===undefined?24:S.config.studentGraceTurns);
      lo.amortStarted=false; lo.monthlyPayment=0; pay=0; } // 寬限期不還
    p.liabilities.push(lo);
    post.push({account:"LIABILITY", delta:l.principal, refId:id, label:l.name});
    post.push({account:"EXPENSE", delta:pay, refId:id, label:l.name+(pay>0?(term>0?" 月付":"利息"):" 寬限期")});
  });
  (prof.startingAssets||[]).forEach(function(a){
    var id = util.uid(S,"A");
    p.assets.push({ instanceId:id, cardId:a.cardId, kind:a.kind, name:a.name, units:1,
      costBasis:a.costBasis, marketValue:a.marketValue, monthlyIncome:a.monthlyIncome||0,
      equityPct:a.equityPct, postMoney:a.postMoney, linkedLiabilityId:null, flags:a.flags||{} });
    post.push({account:"ASSET", delta:a.marketValue, refId:id, label:a.name});
  });
  p.ledger.push({ entryId:util.uid(S,"e"), turnNumber:0, playerId:idx, sourceAction:-1,
    summary:"開局："+prof.name, postings:post, eduTags:["setup"], detail:null, kind:"SETUP" });
  ledger.recompute(p);
  return p;
};

/* --- 牌堆 --- */
E.buildDecks = function(S){
  var C = ns.content, mods = S.enabledModules;
  function ok(c){ return !c.moduleReq || mods.indexOf(c.moduleReq)>=0; }
  ["OPPORTUNITY_SMALL","OPPORTUNITY_LARGE","LIFESTYLE","MARKET","LIFE_EVENT","OUTER_LIFE"].forEach(function(d){
    var pool = (C.cards[d]||[]).filter(ok);
    if(d==="LIFE_EVENT"){
      // 自我投資卡每局只抽樣少量，其餘全留；避免稀釋品格卡
      var si = pool.filter(function(c){ return c.kind==="SELF_INVEST"; });
      var rest = pool.filter(function(c){ return c.kind!=="SELF_INVEST"; });
      var n = S.config.selfInvestPerGame!==undefined ? S.config.selfInvestPerGame : 5;
      si = util.shuffle(S, si).slice(0, n);
      pool = rest.concat(si);
    }
    S.decks[d] = { draw: util.shuffle(S,pool.map(function(c){return c.id;})), discard: [] };
  });
  // 職業專屬事件注入 LIFE_EVENT
  var inject = [];
  S.players.forEach(function(p){
    var prof = ns.content.professionById[p.professionId];
    (prof.professionEvents||[]).forEach(function(eid){
      for(var k=0;k<S.config.professionEventCopies;k++) inject.push(eid);
    });
  });
  // M6：人生百態抽樣（修養卡保證排在同軸考驗卡之前）
  if(mods.indexOf("M6")>=0){
    var tap = (C.cards.LIFE_TAPESTRY||[]);
    var byKind = function(k){ return tap.filter(function(c){ return c.subKind===k; }); };
    var cult = util.shuffle(S,byKind("CULTIVATE")).slice(0,S.config.tapestryCultivatePerGame);
    var tri  = util.shuffle(S,byKind("TRIAL")).slice(0,S.config.tapestryTrialPerGame);
    var dly  = util.shuffle(S,byKind("DAILY")).slice(0,S.config.tapestryDailyPerGame);
    S.tapestrySample = cult.concat(tri).concat(dly).map(function(c){return c.id;});
    var le = S.decks.LIFE_EVENT.draw.concat(cult.map(function(c){return c.id;}),
                                            tri.map(function(c){return c.id;}), inject);
    le = util.shuffle(S,le);
    if(S.config.trialFrontloadGuard){
      ["TEMPER","PRUDENCE","PARENTING","FILIAL"].forEach(function(ax){
        var iC=-1,iT=-1;
        for(var i=0;i<le.length;i++){ var c=ns.content.byId[le[i]]; if(!c||c.kind!=="TAPESTRY") continue;
          if(c.virtueAxis!==ax) continue;
          if(iC<0 && c.subKind==="CULTIVATE") iC=i;
          if(iT<0 && c.subKind==="TRIAL") iT=i; }
        if(iC>=0 && iT>=0 && iT<iC){ var t=le[iT]; le[iT]=le[iC]; le[iC]=t; }
      });
    }
    S.decks.LIFE_EVENT.draw = le;
    S.decks.LIFESTYLE.draw = util.shuffle(S, S.decks.LIFESTYLE.draw.concat(dly.map(function(c){return c.id;})));
  } else if(inject.length){
    S.decks.LIFE_EVENT.draw = util.shuffle(S, S.decks.LIFE_EVENT.draw.concat(inject));
  }
  if(mods.indexOf("M4")>=0){
    var me = (C.cards.MACRO_EVENT||[]);
    S.decks.MACRO_EVENT = { draw: util.shuffle(S, me.map(function(c){return c.id;})), discard: [] };
  }
};

E.drawCard = function(S, deckId, filterFn){
  var d = S.decks[deckId]; if(!d) return null;
  for(var guard=0; guard<200; guard++){
    if(!d.draw.length){ if(!d.discard.length) return null;
      d.draw = util.shuffle(S, d.discard); d.discard = []; }
    var id = d.draw.shift(); var card = ns.content.byId[id];
    if(!card){ continue; }
    if(filterFn && !filterFn(card)){ d.discard.push(id); continue; }
    d.discard.push(id); return card;
  }
  return null;
};

// §2.3 機會二選一：抽 2 張（同一牌堆）；牌堆不足時退化為單張
// 兩張都用主流 RNG 連抽；未選的那張已在棄牌堆（drawCard 抽出即入棄牌堆）
E.drawTwo = function(S, deckId, filterFn){
  var c1 = E.drawCard(S, deckId, filterFn);
  if(!c1) return [];
  var d = S.decks[deckId];
  var i1 = d.discard.lastIndexOf(c1.id);
  if(i1>=0) d.discard.splice(i1,1);          // 暫時取出，避免重洗時抽到同一張
  var c2 = E.drawCard(S, deckId, filterFn);
  d.discard.push(c1.id);                      // 第一張放回棄牌堆
  return (c2 && c2.id!==c1.id) ? [c1,c2] : [c1];
};
// 機會卡的「可比較」數據：入手現金、該筆資金下的實際月現金流、年化現金報酬率
// 註：E.oppIncome / E.oppEntry 只涵蓋 REALESTATE / BUSINESS（第二期拍賣估值沿用，不動），
//     二選一要能比較股票與新創，故另立此函式；REALESTATE 以預設貸款成數計，扣掉房貸月付才是真現金流。
E.oppCompare = function(S, card){
  var pl=card.payload||{}, im=S.config.assetIncomeMult;
  var entry=0, income=0, note="";
  if(card.kind==="REALESTATE"){
    var ltv = E.canUseLoan(S) ? Math.min(1-(pl.downPayment||0)/(pl.price||1), E.effMaxLTV(S)) : 0;
    if(!(ltv>0)) ltv=0;
    var loan=util.r2((pl.price||0)*ltv);
    entry=util.r2((pl.price||0)-loan);
    var rate=E.rRate(S.macro.baseRate+E.cfg(S,"mortgageSpread"));
    var pay=loan>0 ? E.pmt(loan, rate, E.loanTerm(S,"MORTGAGE",false)) : 0;
    income=util.r2((pl.monthlyRent||0)*im-(pl.monthlyCost||0)-pay);
    note = loan>0 ? ("含房貸 "+util.pct(ltv,0)+"成、月付已扣") : "全額現金";
  } else if(card.kind==="BUSINESS"){
    entry=util.r2(pl.price||0);
    income=util.r2((pl.monthlyProfit||0)*im);
    note="全額現金（景氣係數會影響分紅）";
  } else if(card.kind==="STOCK"){
    var def=ns.content.stockBySymbol[pl.symbol];
    entry=util.r2(S.stockPrices[pl.symbol]||pl.offerPrice||0);
    income=def?util.r2(entry*def.dividendYieldMonthly):0;
    note = (def && def.dividendYieldMonthly>0) ? "以 1 張計；主要靠價差" : "不配息，靠價差";
  } else if(card.kind==="STARTUP"){
    entry=util.r2(pl.investAmount||0);
    income=0;
    note="無月現金流，賭退出價差";
  }
  var yr = entry>0 ? income*12/entry : 0;
  return { entry:entry, income:income, yield:yr, note:note };
};
E.oppYield = function(S, card){ return E.oppCompare(S,card).yield; };

/* ================= §2.4 幸福感盲盒（幸福感搬進引擎，可重放） ================ */
// 幸福感＝家庭×3 ＋ 品格總和 ＋ 圓夢進度 ＋ 生活享受次數（純函式，UI 呼叫此版）
E.wellbeing = function(S, p){
  var v=0;
  v += (p.childrenCount||0)*3;
  if(p.virtues){ for(var k in p.virtues) v += p.virtues[k]; }
  v += (p.dreamProgress||0);
  v += ((p.stats && p.stats.optionalBought)||0);
  v += ((p.stats && p.stats.mallJoy)||0);          // V10：商城的正向活動
  return v;
};

// V10：健康狀態（健身房年約／高階健檢）在有效期內折抵醫療意外支出
E.healthDiscount = function(S, p){
  if(!p.flags) return 0;
  var t=S.turnNumber, on=false;
  if(p.flags.fitUntil!==undefined && t<=p.flags.fitUntil) on=true;
  if(p.flags.checkedUntil!==undefined && t<=p.flags.checkedUntil) on=true;
  if(!on) return 0;
  var d=E.cfg(S,"healthDiscountPct"); if(d===undefined) d=0.3;
  return d;
};
// 加權抽獎（主流 RNG；累積機率第一個命中即 break——工程書 §1.9-5）
E.blessingPool = function(S){
  return [
    {key:"VIRTUE",   w:E.cfg(S,"blessingW_VIRTUE")},
    {key:"DREAM",    w:E.cfg(S,"blessingW_DREAM")},
    {key:"GUARDIAN", w:E.cfg(S,"blessingW_GUARDIAN")},
    {key:"JOY",      w:E.cfg(S,"blessingW_JOY")},
    {key:"CASH",     w:E.cfg(S,"blessingW_CASH")}
  ].filter(function(x){ return x.w>0; });
};
// 抽一次並立即結算效果，回傳 {prize, detail}
E.drawBlessing = function(S, p){
  var pool=E.blessingPool(S), tot=0;
  pool.forEach(function(x){ tot+=x.w; });
  if(tot<=0) return {prize:"NONE", detail:"獎池為空"};
  var r=util.rand(S)*tot, acc=0, key=pool[pool.length-1].key;
  for(var i=0;i<pool.length;i++){ acc+=pool[i].w; if(r<acc){ key=pool[i].key; break; } }
  var detail="";
  if(key==="VIRTUE"){
    var cap=E.cfg(S,"virtueMaxLevel"); if(cap===undefined) cap=3;
    var axes=["TEMPER","PRUDENCE","PARENTING","FILIAL"].filter(function(a){ return (p.virtues[a]||0)<cap; });
    if(axes.length){
      var ax=axes[Math.floor(util.rand(S)*axes.length)];
      p.virtues[ax]=(p.virtues[ax]||0)+1;
      detail=ax; E.ev("VIRTUE_UP",{playerId:p.id, axis:ax, level:p.virtues[ax]});
    } else { key="JOY"; }                                  // 品格已滿 → 退為小確幸
  }
  if(key==="DREAM"){
    p.dreamProgress=(p.dreamProgress||0)+1;
    detail="夢想進度 +1（現為 "+p.dreamProgress+"）";
  } else if(key==="GUARDIAN"){
    if(!p.flags) p.flags={};
    p.flags.guardian=true;
    detail="下一張負面人生事件費用減免 "+Math.round(E.cfg(S,"guardianDiscount")*100)+"%";
  } else if(key==="JOY"){
    p.stats.optionalBought=(p.stats.optionalBought||0)+2;   // 幸福感 +2，不佔支出
    if(!detail) detail="幸福感 +2，且不進支出表";
  } else if(key==="CASH"){
    var lo=E.cfg(S,"blessingCashMin"), hi=E.cfg(S,"blessingCashMax");
    if(lo===undefined) lo=50; if(hi===undefined) hi=150;
    var amt=E.randInt(S, lo, hi);
    ledger.post(S,p,"幸福感的回報：小額紅包",[{account:"CASH",delta:amt,label:"紅包"}],{eduTags:["blessing"]});
    detail=util.money(amt);
  }
  E.ev("BLESSING_DRAWN",{playerId:p.id, prize:key, detail:detail});
  return {prize:key, detail:detail};
};
// endTurn 前檢查：幸福感高水位每跨過 blessingStep 的倍數得一抽（HWM 只增不減）
E.checkBlessing = function(S, p){
  if(p.bankrupt) return false;
  var step=E.cfg(S,"blessingStep"); if(!(step>0)) return false;
  var wb=E.wellbeing(S,p), hwm=p.blessingHWM||0;
  if(wb<=hwm) return false;                                  // 沒創新高：不可能跨新檔位
  var cross = Math.floor(wb/step) > Math.floor(hwm/step);
  p.blessingHWM = wb;                                        // 高水位永遠只往上
  if(!cross) return false;
  var got=E.drawBlessing(S,p);
  E.pushDecision(S,p,{kind:"BLESSING", prize:got.prize, detail:got.detail, wellbeing:wb});
  return true;
};

/* --- 玩家可用性判定 --- */
E.canUseLoan = function(S){ return S.config.depthLevel>=2 && S.enabledModules.indexOf("M2")>=0; };
E.canUseAdvanced = function(S){ return S.config.depthLevel>=3; };
E.activePlayer = function(S){ return S.players[S.activePlayerIdx]; };
E.alive = function(S){ return S.players.filter(function(p){ return !p.bankrupt; }); };

/* --------------------------- 效果 DSL 執行器 ------------------------------ */
E.applyEffects = function(S, p, effects, label, opts){
  if(!effects) return;
  opts = opts||{};
  var rate = S.config.eventCardRate;
  effects.forEach(function(ef){
    var targets = ef.target==="all" ? E.alive(S)
                : ef.target==="others" ? E.alive(S).filter(function(x){return x.id!==p.id;})
                : [p];
    switch(ef.op){
      case "CASH_DELTA":
        targets.forEach(function(t){
          if(ef.filter && !t.assets.some(function(a){return a.kind===ef.filter.kind;})) return;
          var amt = util.r2(ef.amount * (ef.amount<0 ? rate : 1));
          // §2.4 貴人相助：負面人生事件費用減免一次（觸發後清旗標）
          if(amt<0 && opts.lifeEvent && t.flags && t.flags.guardian){
            var disc=E.cfg(S,"guardianDiscount"); if(disc===undefined) disc=0.5;
            var saved=util.r2(-amt*disc);
            amt=util.r2(amt*(1-disc));
            t.flags.guardian=false;
            E.ev("GUARDIAN_USED",{playerId:t.id, saved:saved, label:ef.label||label});
          }
          // V10：健康狀態（健身房／健檢）先折抵，再由醫療意外險理賠
          // V11.1：把每一段折抵記下來，讓事件卡可以列出「原價／折抵／理賠／實付／省下」
          var gross0=amt, hSaved=0, claim=0, wouldClaim=0;
          if(amt<0 && opts.insurable){
            var hd=E.healthDiscount(S,t);
            if(hd>0){ hSaved=util.r2(-amt*hd); amt=util.r2(amt*(1-hd));
              E.ev("HEALTH_DISCOUNT",{playerId:t.id, saved:hSaved, label:ef.label||label}); }
            var cp=E.cfg(S,"insuranceClaimPct"); if(cp===undefined) cp=0.6;
            if(t.flags && t.flags.insured){
              claim=util.r2(-amt*cp);
              if(claim>0){ amt=util.r2(amt+claim);
                E.ev("INSURANCE_CLAIM",{playerId:t.id, claim:claim, label:ef.label||label}); }
            } else {
              wouldClaim=util.r2(-amt*cp);      // 沒保險：記下「本來可以省下多少」當對照
            }
            if(opts.claimOut) opts.claimOut.push({
              playerId:t.id, label:ef.label||label,
              gross:util.r2(-gross0), healthSaved:hSaved, claim:claim,
              net:util.r2(-amt), wouldClaim:wouldClaim,
              insured:!!(t.flags&&t.flags.insured), healthOn:E.healthDiscount(S,t)>0,
              claimPct:cp, healthPct:E.healthDiscount(S,t)
            });
          }
          ledger.post(S,t, ef.label||label, [{account:"CASH",delta:amt,label:ef.label||label}], {eduTags:["event"]});
        }); break;
      case "SKIP_TURNS":   // v0.2：重大傷病等事件的停走（通用 DSL op）
        targets.forEach(function(t){ t.skippedTurns += (ef.turns||1);
          E.ev("TURNS_SKIPPED",{playerId:t.id, turns:(ef.turns||1), label:ef.label||label}); });
        break;
      case "ADD_RECURRING_EXPENSE":
        targets.forEach(function(t){
          var amt = util.r2(ef.amount);
          ledger.post(S,t, ef.label||label, [{account:"EXPENSE",delta:amt,label:ef.label||label}], {eduTags:["recurring"]});
          if(ef.durationTurns) S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"EXPENSE_REVERT",
            playerId:t.id, amount:amt, until:S.turnNumber+ef.durationTurns, label:ef.label||label, priority:0, param:null });
        }); break;
      case "SALARY_MULT":
        targets.forEach(function(t){
          var delta = util.r2(t.derived.salaryIncome*(ef.factor-1)); if(!delta) return;
          t.baseSalary = util.r2(t.baseSalary*ef.factor);
          ledger.post(S,t, ef.label||label, [{account:"INCOME_ACTIVE",delta:delta,label:ef.label||label}], {eduTags:["career"]});
        }); break;
      case "ASSET_VALUE_MULT":
        targets.forEach(function(t){ t.assets.forEach(function(a){
          if(ef.filter && ef.filter.kind && a.kind!==ef.filter.kind) return;
          var nv = util.r2(a.marketValue*ef.factor), d = util.r2(nv-a.marketValue); if(!d) return;
          a.marketValue = nv;
          ledger.post(S,t, ef.label||label, [{account:"ASSET",delta:d,refId:a.instanceId,label:a.name+" 估值變動"}], {eduTags:["valuation"]});
        }); }); break;
      case "ASSET_INCOME_MULT":
        targets.forEach(function(t){ t.assets.forEach(function(a){
          if(ef.filter && ef.filter.kind && a.kind!==ef.filter.kind) return;
          var ni = util.r2(a.monthlyIncome*ef.factor), d = util.r2(ni-a.monthlyIncome); if(!d) return;
          a.monthlyIncome = ni;
          ledger.post(S,t, ef.label||label, [{account:"INCOME_PASSIVE",delta:d,refId:a.instanceId,label:a.name+" 收入變動"}], {eduTags:["cashflow"]});
          if(ef.durationTurns) S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"INCOME_REVERT",
            playerId:t.id, assetId:a.instanceId, amount:util.r2(-d), until:S.turnNumber+ef.durationTurns,
            label:ef.label||label, priority:0, param:null });
        }); }); break;
      case "OFFER_SELL_WINDOW":
        S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"SELL_WINDOW", filter:ef.filter,
          priceMult:ef.priceMult, until:S.turnNumber+2, label:ef.label||label, priority:0, param:null });
        break;
      case "SET_PARAM":
        S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"PARAM", param:ef.param, value:ef.value,
          until:S.turnNumber+(ef.durationTurns||4), label:ef.label||label, priority:ef.priority||0 });
        if(ef.param==="mortgageSpread"||ef.param==="maxLTV") E.repriceFloating(S);
        break;
      case "ADD_CHILD":
        targets.forEach(function(t){
          if(t.childrenCount >= S.config.childExpenseCap) return;
          t.childrenCount++;
          var c = util.r2(ns.content.professionById[t.professionId].perChildExpense*S.config.expenseMult);
          ledger.post(S,t,"養育支出增加",[{account:"EXPENSE",delta:c,label:"養育支出"}],{eduTags:["family"]});
        }); break;
      case "SKIP_TURNS":
        targets.forEach(function(t){ t.skippedTurns += (ef.n||1); }); break;
      case "STOCK_PRICE_SET":
        if(S.stockPrices[ef.symbol]!==undefined){
          var def = ns.content.stockBySymbol[ef.symbol];
          S.stockPrices[ef.symbol] = E.clampPrice(S, def, S.stockPrices[ef.symbol]*ef.mult);
          E.revalueStocks(S);
        } break;
      case "DIVIDEND_BONUS":
        S.dividendBonus[ef.symbol] = ef.mult;
        S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"DIV_BONUS", symbol:ef.symbol,
          until:S.turnNumber+1, label:ef.label||label, priority:0, param:null });
        break;
      case "SPACE_EFFECT_MULT":
        S.spaceMult[ef.spaceType] = ef.factor;
        S.activeGlobalEvents.push({ seq:++S.eventSeq, kind:"SPACE_MULT", spaceType:ef.spaceType,
          until:S.turnNumber+(ef.durationTurns||4), label:ef.label||label, priority:0, param:null });
        break;
      case "GRANT_VIRTUE":
        targets.forEach(function(t){
          var mx=S.config.virtueMaxLevel;
          var nv=(t.virtues[ef.axis]||0)+ef.delta;
          t.virtues[ef.axis]=Math.max(0, Math.min(mx, nv));
        }); break;
      case "GRANT_DECISION":
        E.pushDecision(S, p, { kind:ef.decisionKind, params:ef.params||{} }); break;
    }
  });
};

E.clampPrice = function(S, def, v){
  return util.r2(Math.min(def.face*S.config.stockCapMult, Math.max(def.face*S.config.stockFloorMult, v)));
};

/* 股價變動後，重估所有玩家的股票資產（產生分錄） */
// 每局股票顯示名（開局隨機化）
E.stockName = function(S, sym){
  return (S.stockNames && S.stockNames[sym]) || (ns.content.stockBySymbol[sym] && ns.content.stockBySymbol[sym].name) || sym;
};

E.revalueStocks = function(S){
  S.players.forEach(function(p){ var agg=0; p.assets.forEach(function(a){
    if(a.kind!=="STOCK") return;
    var nv = util.r2(S.stockPrices[a.symbol]*a.units), d = util.r2(nv-a.marketValue);
    if(!d) return; a.marketValue = nv; agg += d;
    ledger.post(S,p,E.stockName(S,a.symbol)+" 股價變動",[{account:"ASSET",delta:d,refId:a.instanceId,label:"市值變動"}],{eduTags:["valuation"]});
    // 股息為每股固定（依面值），不隨價格調整 → 價格跌，殖利率反而上升（更真實）
  });
  if(Math.abs(agg)>=0.5) E.ev("HOLDINGS_REVALUED",{playerId:p.id, delta:util.r2(agg)}); });
};
// 每股月配息（依面值固定）與目前殖利率（隨現價浮動）
E.stockPerShareDiv = function(def){ return util.r2(def.face*def.dividendYieldMonthly); };
E.stockYield = function(S, def){ var pr=S.stockPrices[def.symbol]||def.face; return pr>0 ? (def.face*def.dividendYieldMonthly)/pr : def.dividendYieldMonthly; };

/* 浮動利率重算（基準利率或加碼變動時） */
// 依目前基準利率重定價所有浮動貸款
E.rRate = function(x){ return Math.round(x*1e4)/1e4; };  // 利率取 4 位小數（util.r2 太粗）
E.repriceFloating = function(S){
  S.players.forEach(function(p){ p.liabilities.forEach(function(l){
    if(!l.isFloating) return;
    // 九期：房貸沿用政策可調的房貸加碼；其餘貸款用自己承作時的商品加碼
    var nr = E.rRate(S.macro.baseRate + (l.kind==="MORTGAGE" ? E.cfg(S,"mortgageSpread")
                     : (l.rateSpread!==undefined ? l.rateSpread : E.cfg(S,"mortgageSpread")))
                     + E.creditSpread(S,p));
    if(nr===l.annualRate) return;
    l.annualRate=nr;
    var d = E.repriceLoan(l);
    if(d) ledger.post(S,p,"利率調整："+l.name,[{account:"EXPENSE",delta:d,refId:l.instanceId,label:l.name+" 月付調整"}],{eduTags:["rate"]});
  }); });
};
// 央行利率檢視：每 rateReviewTurns 輪，基準利率逐步趨近目標，並回報各玩家影響數
E.reviewRate = function(S){
  var m=S.macro, old=m.baseRate;
  var diff=m.targetRate-old;
  var step=Math.max(-S.config.rateStepMax, Math.min(S.config.rateStepMax, diff));
  var nw=E.rRate(old+step);
  var changed=Math.abs(nw-old)>=0.0005;
  var before={};
  S.players.forEach(function(p){ var s=0; p.liabilities.forEach(function(l){ if(l.isFloating) s+=l.monthlyPayment; }); before[p.id]=util.r2(s); });
  m.baseRate=nw;
  if(changed) E.repriceFloating(S);
  var impacts=[];
  S.players.forEach(function(p){ if(p.bankrupt) return;
    var s=0; p.liabilities.forEach(function(l){ if(l.isFloating) s+=l.monthlyPayment; });
    impacts.push({playerId:p.id, delta:util.r2(s-before[p.id])}); });
  E.ev("RATE_REVIEW",{oldRate:old, newRate:nw, changed:changed, impacts:impacts});
  if(E.cfg(S,"creditReviewWithRate")) E.runCreditReview(S);
};

/* ===================== M7 信用評級（台灣聯徵分數概念） ===================== */
// 該玩家目前評級對新貸款的利率加碼
E.creditSpread = function(S, p){
  var v = E.cfg(S, "creditSpread_"+(p && p.creditRating ? p.creditRating : "B"));
  return v===undefined ? 0 : v;
};
// 評分並回傳 {rating, reasons[]}；純函式，不改 state
E.reviewCredit = function(S, p){
  var d = p.derived || {}, reasons = [], score = 2;
  var totalAsset = Math.max(1, util.r2((p.cash||0) + (d.totalAssets||0)));
  var ratio = (d.totalLiabilities||0) / totalAsset;
  if(ratio > 0.75){ score -= 2; reasons.push("負債比過高"); }
  else if(ratio >= 0.5){ score -= 1; reasons.push("負債比偏高"); }
  else if(ratio < 0.3){ score += 1; reasons.push("負債比健康"); }
  var cf = p.creditFlags || {};
  if(cf.usedRescue){ score -= 2; reasons.push("曾動用紓困"); }
  if(cf.everBankrupt){ score -= 3; reasons.push("曾破產"); }
  if(cf.cashWentNegative){ score -= 1; reasons.push("本期現金為負"); }
  if((d.passiveIncome||0) >= (d.totalExpenses||0) && (d.totalExpenses||0) > 0){ score += 1; reasons.push("被動收入已覆蓋支出"); }
  var rating = score >= 3 ? "A" : (score >= 0 ? "B" : "C");
  return { rating:rating, reasons:reasons, score:score };
};
// 對全體玩家重評，變動時發事件；每次評完清除「本期」旗標
E.runCreditReview = function(S){
  S.players.forEach(function(p){
    if(p.bankrupt) return;
    if(!p.creditFlags) p.creditFlags={usedRescue:false, everBankrupt:false, cashWentNegative:false};
    var r = E.reviewCredit(S,p), from = p.creditRating||"B";
    p.creditRating = r.rating;
    p.creditFlags.cashWentNegative = false;   // 本檢視期旗標歸零
    if(from !== r.rating){
      E.repriceFloating(S);                    // 加碼變動 → 浮動貸款同步重定價
      E.ev("CREDIT_RATING_CHANGED",{playerId:p.id, from:from, to:r.rating, reasons:r.reasons});
    }
  });
};
/* 擷取一段效果對「本人」造成的實際帳務影響（比對套用前後新增分錄） */
E.captureImpact = function(S, p, fn){
  var before = p.ledger.length;
  fn();
  var impact = [];
  for(var i=before; i<p.ledger.length; i++){
    p.ledger[i].postings.forEach(function(q){
      impact.push({ label:p.ledger[i].summary+"｜"+q.label, account:q.account, delta:q.delta });
    });
  }
  return impact;
};

E.pushDecision = function(S, p, d){
  d.decisionId = util.uid(S,"d"); d.playerId = p.id;
  d = ns.modules.decorateDecision(S, p, d);
  S.decisionQueue.push(d);
};
E.syncPhase = function(S){
  if(S.over){ S.phase="GAME_OVER"; S.pendingDecision=null; return; }
  S.pendingDecision = S.decisionQueue.length ? S.decisionQueue[0] : null;
  if(S.pendingDecision){ S.phase = S.pendingDecision.kind==="BANKRUPTCY" ? "BANKRUPTCY" : "DECISION"; return; }
  // 九期：回合中後續自主動作（還款／買賣／借款）也要納入記帳，否則帳目對不起來
  if(E.refreshBookkeeping) E.refreshBookkeeping(S);
  if(S.bookkeeping && S.bookkeeping.tasks.some(function(t){return !t.done;})){ S.phase="BOOKKEEPING"; return; }
  S.phase = S.turnResolved ? "READY_END" : "ROLL";
};
return ns; })();
</script>
<script>
(function(ns){
"use strict";
var util=ns.util, ledger=ns.ledger, E=ns.engine;

/* ========================== 唯一入口：applyAction ========================= */
E.apply = function(state, action, opts){
  opts = opts||{};
  var S = opts.mutate ? state : util.clone(state);
  E._events = [];
  var ev = E.ev;
  var p = E.activePlayer(S);

  function reject(why){ ev("ACTION_REJECTED",{reason:why}); return { state:S, events:E._events, rejected:true }; }
  function accept(){ S.actionLog.push({ seq:S.actionLog.length, playerId:action.playerId,
      type:action.type, payload:action.payload||null }); }

  if(S.over && action.type!=="CONFIG_PATCH") return reject("GAME_OVER");

  switch(action.type){

  case "CONFIG_PATCH": {
    var k=action.payload.key, v=action.payload.value;
    if(!(k in S.config)) return reject("NO_SUCH_PARAM");
    accept(); S.config[k]=v;
    if(k==="mortgageSpread") E.repriceFloating(S);
    ev("CONFIG_PATCHED",{key:k,value:v});
    break; }

  case "ROLL_DICE": {
    if(S.phase!=="ROLL") return reject("WRONG_PHASE");
    if(p.bankrupt) return reject("BANKRUPT");
    accept();
    var roll = util.randInt(S,1,6);
    ns.modules.onDiceRolled(S,p,roll);
    ev("DICE_ROLLED",{playerId:p.id, roll:roll});
    E.doMove(S,p,roll);
    break; }

  case "CHOOSE_DECK": {
    var d0=S.pendingDecision;
    if(!d0 || d0.kind!=="CHOOSE_DECK") return reject("WRONG_PHASE");
    accept(); S.decisionQueue.shift();
    var deckId0 = action.payload.deckId;
    if(deckId0==="NONE"){                      // 六期：第一層即可放棄，不抽卡
      p.stats.passedOpps=(p.stats.passedOpps||0)+1;
      E.ev("OPP_PICKED",{playerId:p.id, cardId:null, cardIds:[]});
      E.afterResolve(S,p);
      break;
    }
    var usable0 = function(c){ return E.cardUsable(S,p,c); };
    if(E.cfg(S,"oppDualChoice")){
      var two = E.drawTwo(S, deckId0, usable0);
      if(two.length===2){
        ev("OPP_DUAL_DRAWN",{playerId:p.id, cardIds:[two[0].id,two[1].id], deckId:deckId0});
        E.pushDecision(S,p,{ kind:"PICK_OPP", cardIds:[two[0].id,two[1].id], deckId:deckId0 });
      } else if(two.length===1){
        E.presentCard(S,p,two[0]);            // 牌堆剩 1 張：退化為現行單張流程
      }
    } else {
      var card = E.drawCard(S, deckId0, usable0);
      if(card){ E.presentCard(S,p,card); }
    }
    E.afterResolve(S,p);
    break; }

  case "DECIDE": {
    var d=S.pendingDecision;
    if(!d) return reject("NO_DECISION");
    if(d.decisionId!==action.payload.decisionId) return reject("STALE_DECISION");
    accept(); S.decisionQueue.shift();
    E.resolveDecision(S,p,d,action.payload.optionId,action.payload.params||{});
    E.afterResolve(S,p);
    break; }

  case "CLASSIFY_ENTRY": {
    if(!S.bookkeeping) return reject("NO_BOOKKEEPING");
    var t = S.bookkeeping.tasks[action.payload.taskIdx];
    if(!t || t.done) return reject("BAD_TASK");
    accept();
    if(ledger.QUADRANT[t.account]===action.payload.quadrant){
      t.done=true; p.stats.bkRight++; ev("CLASSIFY_OK",{taskIdx:action.payload.taskIdx});
    } else {
      p.stats.bkWrong++; ev("CLASSIFY_BAD",{taskIdx:action.payload.taskIdx, hint:t.hint});
      if(S.config.misclassifyPenalty>0)
        ledger.post(S,p,"分類錯誤罰款",[{account:"CASH",delta:-S.config.misclassifyPenalty,label:"罰款"}],{eduTags:["bookkeeping"]});
    }
    E.syncPhase(S);
    break; }

  case "SUBMIT_MANUAL_BOOKS": {
    var da=S.pendingDecision;
    if(!da || da.kind!=="AUDIT") return reject("NO_AUDIT");
    accept(); S.decisionQueue.shift();
    var ansv=action.payload.answers, tol=S.config.auditTolerance, dv=p.derived;
    var truth={active:dv.salaryIncome, passive:dv.passiveIncome, expense:dv.totalExpenses, net:dv.netCashflow};
    var ok=["active","passive","expense","net"].every(function(k){ return Math.abs((ansv[k]||0)-truth[k])<=tol; });
    if(ok){ p.stats.auditPass++; ev("AUDIT_PASSED",{truth:truth}); }
    else { p.stats.auditFail++;
      var cut = util.r2(da.netAmount*(1-S.config.auditPenaltyRatio));
      if(cut>0) ledger.post(S,p,"稽核未通過扣減",[{account:"CASH",delta:-cut,label:"稽核扣減"}],{eduTags:["bookkeeping"]});
      ev("AUDIT_FAILED",{truth:truth, answers:ansv, cut:cut});
    }
    E.afterResolve(S,p);
    break; }

  case "SELL_ASSET": {
    if(p.bankrupt) return reject("BANKRUPT");
    if(S.phase!=="ROLL" && S.phase!=="READY_END" && S.phase!=="BANKRUPTCY") return reject("WRONG_PHASE");
    var a = p.assets.filter(function(x){return x.instanceId===action.payload.assetId;})[0];
    if(!a) return reject("NO_ASSET");
    accept();
    E.sellAsset(S,p,a, S.phase==="BANKRUPTCY" ? S.config.fireSaleRatio : E.sellMult(S,a));
    if(S.phase==="BANKRUPTCY") E.checkRescued(S,p); else E.syncPhase(S);
    break; }

  case "TRADE_STOCK": {
    if(p.bankrupt) return reject("BANKRUPT");
    if(S.phase!=="ROLL" && S.phase!=="READY_END") return reject("WRONG_PHASE");
    if(S.enabledModules.indexOf("M1")<0) return reject("NO_M1");
    var sym=action.payload.symbol, side=action.payload.side, units=Math.max(1,Math.floor(action.payload.units||1));
    var def=ns.content.stockBySymbol[sym]; if(!def) return reject("NO_SYMBOL");
    var price=S.stockPrices[sym]||def.face;
    // 六期：現股與融資分倉
    var ex=p.assets.filter(function(x){return x.kind==="STOCK"&&x.symbol===sym&&!(x.flags&&x.flags.margin);})[0];
    if(side==="buy"){
      var margin = action.payload.margin && E.canUseAdvanced(S) && S.enabledModules.indexOf("M1")>=0;
      var total=util.r2(price*units);
      var ownCash = margin ? util.r2(total*S.config.marginRatio) : total;
      if(p.cash<ownCash) return reject("NO_CASH");
      accept();
      var div=util.r2(units*def.face*def.dividendYieldMonthly);
      var mergeTo = margin ? null : ex;                       // 融資一律獨立部位
      var aid=mergeTo?mergeTo.instanceId:util.uid(S,"A");
      if(mergeTo){ mergeTo.units+=units; mergeTo.costBasis=util.r2(mergeTo.costBasis+total);
        mergeTo.marketValue=util.r2(mergeTo.marketValue+total);
        mergeTo.monthlyIncome=util.r2(mergeTo.monthlyIncome+div); }
      else { p.assets.push({instanceId:aid,cardId:null,kind:"STOCK",
        name:E.stockName(S,sym)+(margin?"（融資）":""),symbol:sym,units:units,
        costBasis:total,marketValue:total,monthlyIncome:div,linkedLiabilityId:null,
        flags:(margin?{margin:true}:{})}); }
      var pb=[{account:"CASH",delta:-ownCash,label:margin?"融資自備款":"買進股票"},{account:"ASSET",delta:total,refId:aid,label:E.stockName(S,sym)}];
      if(div) pb.push({account:"INCOME_PASSIVE",delta:div,refId:aid,label:E.stockName(S,sym)+" 股息"});
      if(margin){
        var mAmt=util.r2(total-ownCash), mrate=E.rRate(S.macro.baseRate+E.cfg(S,"marginSpread"));
        var mid=E.addLiability(S,p,"MARGIN","融資："+E.stockName(S,sym),mAmt,mrate,false,aid,true);
        var theAsset=p.assets.filter(function(x){return x.instanceId===aid;})[0]; if(theAsset) theAsset.linkedLiabilityId=mid;
        pb.push({account:"LIABILITY",delta:mAmt,refId:mid,label:"融資餘額"});
        pb.push({account:"EXPENSE",delta:util.r2(mAmt*mrate/12),refId:mid,label:"融資利息"});
      }
      ledger.post(S,p,(margin?"融資買進：":"股市買進：")+E.stockName(S,sym)+" ×"+units,pb,{eduTags:margin?["leverage","equity"]:["equity"]});
      E.ev("ASSET_BOUGHT",{playerId:p.id,cardId:null,name:E.stockName(S,sym)});
    } else {
      // 賣出目標：payload.assetId 指定部位（融資整筆平倉）；未指定則賣現股
      if(action.payload.assetId){
        var tgt=p.assets.filter(function(x){return x.instanceId===action.payload.assetId&&x.kind==="STOCK";})[0];
        if(!tgt) return reject("NO_HOLDING");
        accept(); E.sellAsset(S,p,tgt,1); E.syncPhase(S); break;
      }
      if(!ex) return reject("NO_HOLDING");
      units=Math.min(units,ex.units); accept();
      var proceeds=util.r2(price*units), frac=units/ex.units;
      var basisOut=util.r2(ex.costBasis*frac), incOut=util.r2(ex.monthlyIncome*frac);
      var pl=util.r2(proceeds-basisOut);
      ex.units-=units; ex.costBasis=util.r2(ex.costBasis-basisOut);
      ex.marketValue=util.r2(price*ex.units); ex.monthlyIncome=util.r2(ex.monthlyIncome-incOut);
      var sb=[{account:"CASH",delta:proceeds,label:"賣出價款"},
        {account:"ASSET",delta:-proceeds,refId:ex.instanceId,label:E.stockName(S,sym)+" 減碼"}];
      if(incOut) sb.push({account:"INCOME_PASSIVE",delta:-incOut,refId:ex.instanceId,label:E.stockName(S,sym)+" 股息減少"});
      ledger.post(S,p,"股市賣出："+E.stockName(S,sym)+" ×"+units+"（損益 "+(pl>=0?"+":"")+util.money(pl)+"）",sb,{eduTags:["exit"]});
      if(ex.units<=0) p.assets=p.assets.filter(function(x){return x.instanceId!==ex.instanceId;});
      E.ev("ASSET_SOLD",{playerId:p.id,name:E.stockName(S,sym),pl:pl});
    }
    E.syncPhase(S);
    break; }

  case "PROPOSE_TRADE": {
    if(S.phase!=="ROLL" && S.phase!=="READY_END") return reject("WRONG_PHASE");
    var seller=S.players[action.payload.sellerId], buyer=S.players[action.payload.buyerId];
    if(!seller||!buyer||seller.id===buyer.id) return reject("BAD_PARTIES");
    if(buyer.bankrupt||seller.bankrupt) return reject("BANKRUPT");
    var as=seller.assets.filter(function(x){return x.instanceId===action.payload.assetId;})[0];
    if(!as) return reject("NO_ASSET");
    if(as.linkedLiabilityId) return reject("MORTGAGED");
    var ask=Math.max(0, Math.round(action.payload.price));
    accept();
    if(buyer.isNPC){
      var resp=E.aiTradeResponse(S,buyer,as,ask);
      if(resp.action==="accept"){ E.executeTrade(S,seller,buyer,as,ask); S.pendingTrade=null; }
      else if(resp.action==="counter"){ S.pendingTrade={status:"counter",sellerId:seller.id,buyerId:buyer.id,assetId:as.instanceId,askPrice:ask,counterPrice:resp.price,name:as.name};
        E.ev("TRADE_COUNTER",{sellerId:seller.id,buyerId:buyer.id,name:as.name,ask:ask,counter:resp.price}); }
      else { S.pendingTrade=null; E.ev("TRADE_REJECTED",{buyerId:buyer.id,name:as.name}); }
    } else {
      S.pendingTrade={status:"await_human",sellerId:seller.id,buyerId:buyer.id,assetId:as.instanceId,askPrice:ask,name:as.name};
      E.ev("TRADE_OFFERED",{sellerId:seller.id,buyerId:buyer.id,name:as.name,ask:ask});
    }
    E.syncPhase(S);
    break; }

  case "RESPOND_TRADE": {
    var pt=S.pendingTrade; if(!pt) return reject("NO_TRADE");
    accept();
    if(action.payload.accept && (pt.status==="counter"||pt.status==="await_human")){
      var s2=S.players[pt.sellerId], b2=S.players[pt.buyerId];
      var a2=s2.assets.filter(function(x){return x.instanceId===pt.assetId;})[0];
      var px=pt.status==="counter"?pt.counterPrice:(action.payload.price!==undefined?action.payload.price:pt.askPrice);
      if(a2 && b2.cash>=px) E.executeTrade(S,s2,b2,a2,px);
      else E.ev("TRADE_REJECTED",{buyerId:pt.buyerId,name:pt.name});
    } else {
      E.ev("TRADE_REJECTED",{buyerId:pt.buyerId,name:pt.name});
    }
    S.pendingTrade=null; E.syncPhase(S);
    break; }

  case "CLEAR_TRADE": { accept(); S.pendingTrade=null; break; }

  /* §3.1：機會轉讓已拆除；以下為機會拍賣（密封投標一輪制） */
  case "REFER_OPP": {
    // V10：小機會自己吃不下 → 轉介給別人，收一筆介紹費（行規：1–2 個月現金流）
    var dR=S.pendingDecision;
    if(!dR || dR.kind!=="BUY" || dR.playerId!==p.id) return reject("NO_OPP");
    if(action.payload && action.payload.cardId && action.payload.cardId!==dR.cardId) return reject("STALE_CARD");
    var rCard=ns.content.byId[dR.cardId]; if(!rCard) return reject("NO_CARD");
    var tgt=S.players[action.payload.targetId];
    if(!tgt || tgt.id===p.id || tgt.bankrupt) return reject("BAD_TARGET");
    var fee=E.referralFee(S,rCard);
    if(fee<=0) return reject("NO_FEE");
    accept();
    var accepted=E.npcAcceptReferral(S,tgt,rCard,fee);
    if(accepted){
      var before=tgt.ledger.length;
      var defR=E.oppDefaultOption(S,tgt,rCard);
      E.buyAsset(S,tgt,rCard,defR.optionId,defR.params);
      if(tgt.ledger.length>before && tgt.cash>=fee){
        // 對轉：介紹費由受讓人付給轉介人（兩邊各記一筆，帳才會平）
        ledger.post(S,tgt,"支付介紹費："+rCard.title,
          [{account:"CASH",delta:-fee,label:"介紹費（"+p.name+"）"}],{eduTags:["referral"]});
        ledger.post(S,p,"收取介紹費："+rCard.title,
          [{account:"CASH",delta:fee,label:"介紹費（"+tgt.name+"）"}],{eduTags:["referral"]});
        E.ev("REFERRAL_DONE",{fromId:p.id, toId:tgt.id, cardId:rCard.id, title:rCard.title, fee:fee});
      } else {
        accepted=false;   // 買不成 → 視同婉拒，不收費
      }
    }
    if(!accepted) E.ev("REFERRAL_REJECTED",{fromId:p.id, toId:tgt.id, title:rCard.title, fee:fee});
    p.stats.passedOpps++;
    S.decisionQueue.shift(); E.syncPhase(S);
    break; }

  case "MALL_BUY": {
    // V10：人生商城——花錢買正向活動（進修／健康／保險／人情／比賽）
    if(S.phase!=="ROLL" && S.phase!=="READY_END") return reject("WRONG_PHASE");
    if(p.bankrupt) return reject("BANKRUPT");
    var per=E.cfg(S,"mallPerTurn"); if(per===undefined) per=1;
    if(per<=0) return reject("MALL_OFF");
    if((p.mallBoughtThisTurn||0)>=per) return reject("MALL_LIMIT");
    var it=ns.content.byId[action.payload.itemId];
    if(!it || it.kind!=="MALL") return reject("NO_ITEM");
    if(!E.mallAffordable(S,p,it)) return reject("NO_CASH");
    if(it.payload.reqChild && !(p.childrenCount>0)) return reject("NO_CHILD");
    if(it.payload.insurance && p.flags && p.flags.insured) return reject("ALREADY_INSURED");
    if(it.oncePerGame && p.mallBought && p.mallBought[it.id]) return reject("ONCE_ONLY");
    accept();
    E.mallApply(S,p,it);
    E.syncPhase(S);
    break; }

  case "MALL_CANCEL_INSURANCE": {
    if(S.phase!=="ROLL" && S.phase!=="READY_END") return reject("WRONG_PHASE");
    if(!p.flags || !p.flags.insured) return reject("NOT_INSURED");
    accept();
    var prem=p.flags.insurancePremium||0;
    p.flags.insured=false; p.flags.insurancePremium=0;
    if(prem) ledger.post(S,p,"解約：醫療＋意外險",
      [{account:"EXPENSE",delta:-prem,label:"保費終止"}],{eduTags:["insurance"]});
    E.ev("INSURANCE_CANCELLED",{playerId:p.id, premium:prem});
    break; }

  case "START_OPP_AUCTION": {
    var dA=S.pendingDecision;
    if(!dA || dA.kind!=="BUY" || dA.playerId!==p.id) return reject("NO_OPP");
    if(action.payload && action.payload.cardId && action.payload.cardId!==dA.cardId) return reject("STALE_CARD");
    var aCard=ns.content.byId[dA.cardId]; if(!aCard) return reject("NO_CARD");
    accept();
    E.ev("AUCTION_STARTED",{cardId:aCard.id, title:aCard.title, sellerId:p.id});
    // 1) 收密封出價（座位序迭代＝決定論；0＝棄標）
    var bids=[];
    S.players.forEach(function(pl){
      if(pl.bankrupt || pl.id===p.id) return;
      bids.push({playerId:pl.id, amount:E.npcAuctionBid(S,pl,aCard)});
    });
    // 2) 結算：最高價得標，同價取座位序小者；buyAsset 失敗遞補次高，全滅＝流標
    var ranked=bids.filter(function(b){return b.amount>0;})
      .sort(function(a,b){ return b.amount-a.amount || a.playerId-b.playerId; });
    var winner=null, price=0;
    for(var bi=0; bi<ranked.length; bi++){
      var cand=S.players[ranked[bi].playerId];
      var before=cand.ledger.length;
      var defOpt=E.oppDefaultOption(S,cand,aCard);
      E.buyAsset(S,cand,aCard,defOpt.optionId,defOpt.params);
      if(cand.ledger.length>before){ winner=cand; price=ranked[bi].amount; break; }
    }
    if(winner){
      // 3) 價金對轉：得標者另付出價金給抽卡人
      ledger.post(S,winner,"拍賣得標價金：「"+aCard.title+"」",
        [{account:"CASH",delta:-price,label:"價金付給 "+p.name}],{eduTags:["trade"]});
      ledger.post(S,p,"機會拍賣成交：「"+aCard.title+"」",
        [{account:"CASH",delta:price,label:"得標價金（"+winner.name+"）"}],{eduTags:["trade"]});
      p.stats.passedOpps++;                       // 對抽卡人而言＝放掉的機會（換得價金）
      S.decisionQueue.shift();                     // 抽卡人 BUY 決策以「已拍出」resolve
      E.ev("AUCTION_RESULT",{winnerId:winner.id, bids:bids, price:price,
                             cardId:aCard.id, title:aCard.title, sellerId:p.id});
      E.afterResolve(S,p);
    } else {
      // 4) 流標：BUY 決策保留，回到 買下／跳過
      E.ev("AUCTION_RESULT",{winnerId:null, bids:bids, price:0,
                             cardId:aCard.id, title:aCard.title, sellerId:p.id});
    }
    break; }

  /* ======================= §4 P2P 借貸提案（人類發起、NPC 應答） ======================= */
  case "PROPOSE_P2P": {
    var pp=action.payload||{};
    var lender=S.players[pp.lenderId], borrower=S.players[pp.borrowerId];
    if(!lender || !borrower || lender.id===borrower.id) return reject("BAD_PARTY");
    if(lender.bankrupt || borrower.bankrupt) return reject("BAD_PARTY");
    if(action.playerId!==lender.id && action.playerId!==borrower.id) return reject("NOT_PARTY");
    var amt=util.r2(pp.amount||0); if(amt<=0) return reject("BAD_AMOUNT");
    var rate=E.rRate(pp.annualRate||0);
    var maxR=E.cfg(S,"p2pMaxRate"); if(maxR===undefined) maxR=0.18;
    if(!(rate>0 && rate<=maxR+1e-9)) return reject("BAD_RATE");
    var term=pp.termMonths|0; if(!(term>0)){ term=E.cfg(S,"p2pDefaultTerm"); if(term===undefined) term=24; }
    if(lender.cash<amt) return reject("NO_CASH");
    accept();
    var other = (action.playerId===lender.id) ? borrower : lender;
    var ok;
    if(other.id===lender.id){
      // 對方是放款人：cash − amount ≥ reserve×倍數 且 rate ≥ 動態下限
      var wL = other.isNPC ? ns.content.personalityById[other.npcPersonality].weights : {cashReserveFloor:3};
      var rm=E.cfg(S,"p2pLenderReserveMult"); if(rm===undefined) rm=1.5;
      ok = (other.cash-amt >= wL.cashReserveFloor*other.derived.totalExpenses*rm)
           && (rate >= E.p2pMinRate(S,borrower)-1e-9);
    } else {
      // 對方是借款人：銀行 DBR 已滿（信用額度用罄）且利率不超過上限
      ok = (E.creditCapacity(S,other) < 1) && (rate <= maxR+1e-9);
    }
    if(!ok){
      E.ev("P2P_REJECTED",{lenderId:lender.id, borrowerId:borrower.id, amount:amt, rate:rate,
        byId:other.id, minRate:E.p2pMinRate(S,borrower)});
      break;
    }
    E.formP2P(S,lender,borrower,amt,rate,term);
    E.syncPhase(S);
    break; }

  /* ===================== §3.2 合資 JV（出資比＝股權比） ===================== */
  case "PROPOSE_JV": {
    var dJ=S.pendingDecision;
    if(!dJ || dJ.kind!=="BUY" || dJ.playerId!==p.id) return reject("NO_OPP");
    if(action.payload.cardId && action.payload.cardId!==dJ.cardId) return reject("STALE_CARD");
    var jCard=ns.content.byId[dJ.cardId]; if(!jCard) return reject("NO_CARD");
    if(jCard.kind!=="REALESTATE" && jCard.kind!=="BUSINESS") return reject("BAD_KIND");
    var partner=S.players[action.payload.partnerId];
    if(!partner || partner.bankrupt || partner.id===p.id) return reject("BAD_PARTNER");
    var minS=E.cfg(S,"jvMinShare"); if(minS===undefined) minS=0.2;
    var myShare=util.r2(action.payload.myShare);
    if(!(myShare>=minS-1e-9 && myShare<=1-minS+1e-9)) return reject("BAD_SHARE");
    accept();
    var inc=E.oppIncome(S,jCard), entry=E.oppEntry(S,jCard);
    // 夥伴評估（NPC 決定論；人類夥伴不存在於現行單人版，沿用穩健規則）
    var wJ = partner.isNPC ? ns.content.personalityById[partner.npcPersonality].weights : {cashReserveFloor:3};
    var pReserve = wJ.cashReserveFloor*partner.derived.totalExpenses;
    var pEntry = util.r2(entry*(1-myShare));
    if(!(inc>0 && partner.cash - pEntry >= pReserve)){
      E.ev("JV_REJECTED",{cardId:jCard.id, title:jCard.title, partnerId:partner.id, reason:"partner"});
      break;                                        // BUY 決策保留
    }
    // 先驗後買（規格指定）：兩方都以 oppEntry×share ≤ cash−reserve 驗算通過才執行
    // 發起人（人類）reserve 以 0 計（UI 另有 spendGuard）；並加驗實際買入路徑的自備款
    var myEntry = util.r2(entry*myShare);
    if(p.cash - myEntry < 0){
      E.ev("JV_REJECTED",{cardId:jCard.id, title:jCard.title, partnerId:partner.id, reason:"self"});
      break;
    }
    // 比例分割（util.r2；尾差歸發起人，總和不漂移）
    function splitVal(v){ v=v||0; var pv=util.r2(v*(1-myShare)); return {partner:pv, mine:util.r2(v-pv)}; }
    var pl0=jCard.payload, mineP={}, partP={};
    if(jCard.kind==="REALESTATE"){
      ["price","downPayment","monthlyRent","monthlyCost"].forEach(function(k){
        var sp=splitVal(pl0[k]); mineP[k]=sp.mine; partP[k]=sp.partner; });
      ["mortgageRate","isFloating","exitMultipliers"].forEach(function(k){ mineP[k]=pl0[k]; partP[k]=pl0[k]; });
    } else {
      ["price","monthlyProfit"].forEach(function(k){
        var sp=splitVal(pl0[k]); mineP[k]=sp.mine; partP[k]=sp.partner; });
      if(pl0.volatileProfit){ mineP.volatileProfit=true; partP.volatileProfit=true; }
    }
    var cardMine={id:jCard.id, kind:jCard.kind, title:jCard.title, payload:mineP};
    var cardPart={id:jCard.id, kind:jCard.kind, title:jCard.title, payload:partP};
    // 實際買入路徑自備款驗算（雙方都過才執行；避免半套回滾）
    function needOf(pl2, cd2){
      var o=E.oppDefaultOption(S,pl2,cd2), pp=cd2.payload;
      if(cd2.kind==="REALESTATE" && o.optionId==="loan"){
        var ltv=Math.min(1-(pp.downPayment||0)/Math.max(1,pp.price), E.effMaxLTV(S));
        if(!(ltv>0)) ltv=0;
        return { need: util.r2(pp.price-util.r2(pp.price*ltv)), opt:o };
      }
      if(cd2.kind==="BUSINESS" && o.optionId==="loan"){
        var cap=E.creditCapacity(S,pl2);
        var loanB=util.r2(Math.max(0,Math.min(Math.max(0,pp.price-pl2.cash), cap, pp.price)));
        return { need: util.r2(pp.price-loanB), opt:o };
      }
      return { need: pp.price, opt:o };
    }
    var nMine=needOf(p,cardMine), nPart=needOf(partner,cardPart);
    if(p.cash<nMine.need || partner.cash<nPart.need){
      E.ev("JV_REJECTED",{cardId:jCard.id, title:jCard.title, partnerId:partner.id, reason:"afford"});
      break;
    }
    // 成立：兩筆獨立資產，各自以自己的預設融資走 buyAsset（各背各的貸款）
    var jvId=util.uid(S,"JV");
    function jvBuy(pl2, cd2, share, opt){
      var before=pl2.assets.length;
      E.buyAsset(S,pl2,cd2,opt.optionId,opt.params);
      if(pl2.assets.length<=before) return null;      // 已先驗，理論上不會發生
      var a=pl2.assets[pl2.assets.length-1];
      a.name = jCard.title+"（持份 "+Math.round(share*100)+"%）";
      a.jvGroupId=jvId; a.sharePct=share;
      return a;
    }
    var aPart=jvBuy(partner,cardPart,util.r2(1-myShare),nPart.opt);
    var aMine=jvBuy(p,cardMine,myShare,nMine.opt);
    if(!aPart || !aMine){
      E.ev("JV_REJECTED",{cardId:jCard.id, title:jCard.title, partnerId:partner.id, reason:"buy-fail"});
      break;
    }
    p.stats.passedOpps++;                              // 對發起人：機會以合資形式處置
    S.decisionQueue.shift();
    E.ev("JV_FORMED",{cardId:jCard.id, title:jCard.title, aId:p.id, bId:partner.id,
                      aShare:myShare, jvGroupId:jvId});
    E.afterResolve(S,p);
    break; }

  case "END_GAME": {
    // 七期：玩家可隨時結束遊戲，依現況排名結算（進事件溯源，可重放）
    if(action.playerId!==0) return reject("BAD_PLAYER");
    accept(); E.finishByRanking(S,"MANUAL"); E.syncPhase(S); break; }

  case "TOP_UP_MARGIN": {
    var pT=S.players[action.playerId]; if(!pT||pT.bankrupt) return reject("BAD_PLAYER");
    var lT=pT.liabilities.filter(function(x){return x.instanceId===action.payload.liabilityId;})[0];
    if(!lT || lT.kind!=="MARGIN") return reject("NO_LOAN");
    var aT=pT.assets.filter(function(x){return x.instanceId===lT.collateralAssetId;})[0];
    if(!aT) return reject("NO_ASSET");
    var restoreT=S.config.marginRestoreLevel||1.66;
    var needT=util.r2(Math.max(0, lT.principal - aT.marketValue/restoreT));
    if(needT<=0.01){ accept(); if(lT.flags) delete lT.flags.marginWarned; break; }
    if(pT.cash < needT) return reject("NO_CASH");
    accept();
    E.repay(S,pT,lT,Math.min(needT,lT.principal));
    var lT2=pT.liabilities.filter(function(x){return x.instanceId===action.payload.liabilityId;})[0];
    if(lT2 && lT2.flags) delete lT2.flags.marginWarned;
    E.ev("MARGIN_TOPUP",{playerId:pT.id, name:aT.name, amount:needT});
    break; }

  case "REPAY_LOAN": {
    var l = p.liabilities.filter(function(x){return x.instanceId===action.payload.liabilityId;})[0];
    if(!l) return reject("NO_LIABILITY");
    var amt = Math.min(action.payload.amount, l.principal, p.cash);
    if(amt<=0) return reject("NO_CASH");
    accept(); E.repay(S,p,l,amt); E.syncPhase(S);
    break; }

  case "TAKE_LOAN": {
    if(!E.canUseLoan(S) && S.phase!=="BANKRUPTCY") return reject("DEPTH_LOCKED");
    var isRescue = S.phase==="BANKRUPTCY";
